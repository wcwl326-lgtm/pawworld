<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 每日签到</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Quicksand:wght@700&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "primary":"#02677f","primary-container":"#7ec8e3","on-primary":"#ffffff","on-primary-container":"#005468",
        "primary-fixed":"#b7eaff","primary-fixed-dim":"#87d1ec",
        "secondary":"#705d00","secondary-container":"#fdd73b","on-secondary-container":"#715d00",
        "tertiary":"#2d6a44","tertiary-container":"#8dcc9f","on-tertiary-container":"#185834","tertiary-fixed":"#b0f1c2",
        "surface":"#fff9f0","surface-bright":"#fff9f0","surface-container-low":"#f9f3ea",
        "surface-container":"#f3ede4","surface-container-high":"#ede7df","surface-container-highest":"#e7e2d9",
        "on-surface":"#1d1b16","on-surface-variant":"#3f484c",
        "outline":"#6f787d","outline-variant":"#bfc8cd",
      },
      borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
      spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"40px","xl":"64px","gutter":"16px","container-padding":"20px"},
      fontFamily:{"sans":["Be Vietnam Pro","sans-serif"],"display":["Plus Jakarta Sans","sans-serif"],"label":["Quicksand","sans-serif"]}
    }
  }
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .soft-pop{box-shadow:inset 0 2px 4px rgba(255,255,255,0.4),0 4px 12px rgba(2,103,127,0.15);}
  .squishy:active{transform:scale(0.95) translateY(2px);box-shadow:none!important;}
  body{background-color:#fff9f0;min-height:100dvh;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
  .animate-float{animation:float 3s ease-in-out infinite;}
  .animate-fade-up{animation:fadeUp 0.4s ease both;}
</style>

</head>
<body class="font-sans text-on-surface">
<div class="fixed inset-0 z-0 opacity-30 pointer-events-none" style="background:radial-gradient(ellipse at 20% 20%,#b7eaff 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#b0f1c2 0%,transparent 50%);"></div>

<header class="fixed top-0 w-full z-50 bg-surface-bright/80 backdrop-blur-md">
  <div class="flex justify-between items-center px-container-padding py-sm w-full max-w-lg mx-auto">
    <h1 class="font-display font-extrabold text-xl text-primary">PawWorld</h1>
    <div class="bg-secondary-container px-sm py-xs rounded-full flex items-center gap-xs soft-pop">
      <span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings:'FILL' 1;">local_fire_department</span>
      <span class="font-display font-bold text-sm text-on-secondary-container" id="streak-num">0天连签</span>
    </div>
  </div>
</header>

<main class="relative z-10 pt-20 pb-28 px-container-padding max-w-lg mx-auto">

  <!-- Hero card -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop mb-md animate-fade-up border border-white">
    <div class="flex items-center gap-sm mb-md">
      <div class="w-14 h-14 rounded-2xl bg-secondary-container flex items-center justify-center text-3xl soft-pop">📅</div>
      <div>
        <h2 class="font-display font-bold text-xl text-on-surface">每日签到</h2>
        <p class="text-xs text-on-surface-variant font-label mt-0.5" id="streak-msg">今天还没签到</p>
      </div>
    </div>
    <!-- 7-day grid -->
    <div class="grid grid-cols-7 gap-1.5 mb-md">
      <div class="text-center font-label text-[10px] text-on-surface-variant font-bold">一</div>
      <div class="text-center font-label text-[10px] text-on-surface-variant font-bold">二</div>
      <div class="text-center font-label text-[10px] text-on-surface-variant font-bold">三</div>
      <div class="text-center font-label text-[10px] text-on-surface-variant font-bold">四</div>
      <div class="text-center font-label text-[10px] text-on-surface-variant font-bold">五</div>
      <div class="text-center font-label text-[10px] text-primary font-bold">六</div>
      <div class="text-center font-label text-[10px] text-primary font-bold">日</div>
    </div>
    <div class="grid grid-cols-7 gap-1.5 mb-md" id="checkin-grid">
      <!-- filled by JS -->
    </div>
    <button id="checkin-btn" onclick="doCheckin()" class="w-full py-md rounded-2xl bg-primary text-white font-display font-bold text-lg flex items-center justify-center gap-2 soft-pop squishy shadow-lg shadow-primary/20">
      <span class="material-symbols-outlined">calendar_today</span>
      <span>立即签到！</span>
    </button>
    <p class="text-center text-xs text-on-surface-variant mt-sm font-label" id="next-checkin">每日签到领取奖励</p>
  </div>

  <!-- Rewards list -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop mb-md border border-white animate-fade-up" style="animation-delay:0.05s">
    <h3 class="font-display font-bold text-lg text-on-surface mb-md flex items-center gap-2">
      <span class="material-symbols-outlined text-secondary" style="font-variation-settings:'FILL' 1;">redeem</span>
      签到奖励
    </h3>
    <div class="flex flex-col gap-sm" id="rewards-list">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- Streak milestones -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop border border-white animate-fade-up" style="animation-delay:0.1s">
    <h3 class="font-display font-bold text-lg text-on-surface mb-md flex items-center gap-2">
      <span class="material-symbols-outlined text-primary" style="font-variation-settings:'FILL' 1;">emoji_events</span>
      连签里程碑
    </h3>
    <div class="grid grid-cols-2 gap-sm">
      <div class="bg-tertiary-fixed rounded-xl p-sm text-center">
        <div class="font-display font-bold text-2xl text-tertiary">3天</div>
        <div class="text-xs text-on-surface-variant font-label mt-0.5">+50 积分</div>
      </div>
      <div class="bg-secondary-container/40 rounded-xl p-sm text-center">
        <div class="font-display font-bold text-2xl text-secondary">7天</div>
        <div class="text-xs text-on-surface-variant font-label mt-0.5">+150 积分</div>
      </div>
      <div class="bg-primary-container/40 rounded-xl p-sm text-center">
        <div class="font-display font-bold text-2xl text-primary">14天</div>
        <div class="text-xs text-on-surface-variant font-label mt-0.5">+300 积分</div>
      </div>
      <div class="bg-surface-container-high rounded-xl p-sm text-center">
        <div class="font-display font-bold text-2xl text-on-surface">30天</div>
        <div class="text-xs text-on-surface-variant font-label mt-0.5">+1000 积分</div>
      </div>
    </div>
  </div>

  <!-- Hidden elements for JS compatibility -->
  <div id="already-checked" style="display:none;" class="bg-tertiary-fixed rounded-2xl p-md text-center soft-pop border border-white">
    <div class="text-3xl mb-sm" id="reward-emoji">🎁</div>
    <div class="font-display font-bold text-lg text-on-surface" id="reward-name">今日奖励</div>
    <div class="font-display font-bold text-2xl text-primary" id="reward-amount">+20 积分</div>
    <p class="text-sm text-on-surface-variant mt-sm" id="already-checked-sub">明天再来签到！</p>
  </div>
  <div id="streak-best" style="display:none;"></div>
  <div id="history-list" style="display:none;"></div>
</main>

<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-5 py-3 rounded-full text-sm font-bold z-[500] hidden shadow-lg font-sans"></div>
<div id="confetti-container" class="fixed inset-0 pointer-events-none z-[400]"></div>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter pb-4 bg-surface-container-low shadow-[0_-4px_10px_rgba(2,103,127,0.08)] rounded-t-2xl">
  <a href="/play.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">home</span><span class="font-label text-[10px] font-bold">互动</span></a>
  <a href="/wardrobe.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">styler</span><span class="font-label text-[10px] font-bold">衣橱</span></a>
  <a href="/checkin.html" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 scale-105"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">calendar_today</span><span class="font-label text-[10px] font-bold">签到</span></a>
  <a href="/milestone.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">emoji_events</span><span class="font-label text-[10px] font-bold">成长</span></a>
  <a href="/profile.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">person</span><span class="font-label text-[10px] font-bold">我的</span></a>
</nav>

<script>

// Daily rewards by streak day (cycles every 7 days)
const DAILY_REWARDS = [
  { emoji: '🪙', name: '游戏积分', amount: 30, type: 'coins' },
  { emoji: '🍖', name: '肉骨头 x3', amount: 3, type: 'food', foodId: 'bone' },
  { emoji: '🪙', name: '游戏积分', amount: 50, type: 'coins' },
  { emoji: '⚡', name: '活力恢复', amount: 30, type: 'energy' },
  { emoji: '🪙', name: '游戏积分', amount: 80, type: 'coins' },
  { emoji: '😊', name: '心情大涨', amount: 40, type: 'mood' },
  { emoji: '🎁', name: '大礼包！积分+100', amount: 100, type: 'coins', special: true },
];

const MILESTONES = [
  { days: 3,  emoji: '🌱', name: '初出茅庐', reward: '积分 +50',  coins: 50 },
  { days: 7,  emoji: '🌟', name: '坚持一周', reward: '积分 +150', coins: 150 },
  { days: 14, emoji: '🔥', name: '热情不减', reward: '积分 +300', coins: 300 },
  { days: 30, emoji: '💎', name: '签到达人', reward: '积分 +500', coins: 500 },
  { days: 60, emoji: '👑', name: '传说级主人', reward: '积分 +1000', coins: 1000 },
];

// State
let checkinData = {
  streak: 0,
  bestStreak: 0,
  lastCheckin: null,
  history: [],
  claimedMilestones: []
};

window.addEventListener('load', () => {
  loadCheckinData();
  renderAll();
});

function loadCheckinData() {
  const saved = localStorage.getItem('pw_checkin');
  if (saved) {
    try { checkinData = { ...checkinData, ...JSON.parse(saved) }; } catch {}
  }
}

function saveCheckinData() {
  localStorage.setItem('pw_checkin', JSON.stringify(checkinData));
}

function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

function getYesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function isCheckedToday() {
  return checkinData.lastCheckin === getTodayStr();
}

function getTimeUntilMidnight() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const diff = midnight - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `${h} 小时 ${m} 分钟后`;
}

function getTodayReward() {
  const idx = checkinData.streak % 7;
  return DAILY_REWARDS[idx];
}

function renderAll() {
  renderStreak();
  renderTodayCard();
  renderCalendar();
  renderMilestones();
  renderHistory();
}

function renderStreak() {
  document.getElementById('streak-num').textContent = checkinData.streak;
  document.getElementById('streak-best').textContent = checkinData.bestStreak + ' 天';
  const msgs = [
    '开始你的签到之旅！',
    '好的开始！继续加油！',
    '连续 2 天！棒棒哒！',
    '快到 3 天里程碑了！',
    '半周了！你很棒！',
    '5 天了！再坚持！',
    '6 天！明天就一周！',
    '🎉 连续一周！超厉害！',
  ];
  const msg = msgs[Math.min(checkinData.streak, msgs.length - 1)];
  document.getElementById('streak-msg').textContent = msg;
}

function renderTodayCard() {
  const reward = getTodayReward();
  document.getElementById('reward-emoji').textContent = reward.emoji;
  document.getElementById('reward-name').textContent = reward.name;
  document.getElementById('reward-amount').textContent = reward.special ? '🎊 特别奖励！' : '';

  if (isCheckedToday()) {
    document.getElementById('checkin-btn').style.display = 'none';
    document.getElementById('already-checked').style.display = 'block';
    document.getElementById('next-checkin').style.display = 'block';
    document.getElementById('next-checkin').textContent = `⏰ ${getTimeUntilMidnight()}后可再次签到`;
    document.getElementById('already-checked-sub').textContent =
      checkinData.streak >= 7 ? `🔥 已连续签到 ${checkinData.streak} 天，太厉害了！` :
      `还差 ${7 - checkinData.streak % 7} 天领取大礼包！`;
  } else {
    document.getElementById('checkin-btn').style.display = 'block';
    document.getElementById('already-checked').style.display = 'none';
    document.getElementById('next-checkin').style.display = 'none';
  }
}

function renderCalendar() {
  const grid = document.getElementById('checkin-grid');
  grid.innerHTML = '';
  const today = new Date();
  const dayNames = ['日','一','二','三','四','五','六'];

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    const isToday = i === 0;
    const isDone = checkinData.history.includes(dateStr);
    const rewardIdx = (checkinData.streak - i + 7) % 7;
    const reward = DAILY_REWARDS[Math.max(0, rewardIdx)];

    const div = document.createElement('div');
    div.className = 'day-item';
    const circleClass = isDone ? 'done' : isToday ? 'today' : i < 0 ? 'future' : '';
    div.innerHTML = `
      <div class="day-circle ${circleClass}">${isDone ? '✅' : isToday ? '📅' : reward.emoji}</div>
      <div class="day-label">${dayNames[d.getDay()]}</div>
      <div class="day-reward">${isDone ? '' : reward.type === 'coins' ? `+${reward.amount}` : reward.emoji}</div>
    `;
    grid.appendChild(div);
  }
}

function renderMilestones() {
  const list = document.getElementById('rewards-list');
  list.innerHTML = '';
  MILESTONES.forEach(m => {
    const achieved = checkinData.streak >= m.days;
    const claimed = checkinData.claimedMilestones?.includes(m.days);
    const isCurrent = checkinData.streak >= m.days - 2 && checkinData.streak < m.days + 3;
    const item = document.createElement('div');
    item.className = 'milestone-item' + (achieved ? ' achieved' : isCurrent ? ' current' : '');
    item.innerHTML = `
      <div class="milestone-emoji">${m.emoji}</div>
      <div class="milestone-info">
        <div class="milestone-name">${m.name}</div>
        <div class="milestone-days">连续签到 ${m.days} 天</div>
      </div>
      <div class="milestone-reward">${m.reward}</div>
      <div class="milestone-check">${claimed ? '✅' : achieved ? '🎁' : checkinData.streak >= m.days - 3 ? '🔜' : '🔒'}</div>
    `;
    if (achieved && !claimed) {
      item.style.cursor = 'pointer';
      item.onclick = () => claimMilestone(m);
    }
    list.appendChild(item);
  });
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  const recent = [...checkinData.history].reverse().slice(0, 5);
  if (recent.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:12px;">还没有签到记录，快去签到吧！</div>';
    return;
  }
  recent.forEach((dateStr, i) => {
    const rewardIdx = i % 7;
    const reward = DAILY_REWARDS[rewardIdx];
    const item = document.createElement('div');
    item.className = 'history-item';
    const date = new Date(dateStr);
    const label = i === 0 ? '今天' : i === 1 ? '昨天' : dateStr;
    item.innerHTML = `
      <div class="history-emoji">${reward.emoji}</div>
      <div class="history-info">
        <div class="history-name">${reward.name}</div>
        <div class="history-date">${label}</div>
      </div>
      <div class="history-amount">${reward.type === 'coins' ? '+' + reward.amount + '🪙' : reward.emoji}</div>
    `;
    list.appendChild(item);
  });
}

function doCheckin() {
  if (isCheckedToday()) return;
  const today = getTodayStr();
  const yesterday = getYesterdayStr();

  // Update streak
  if (checkinData.lastCheckin === yesterday) {
    checkinData.streak++;
  } else if (checkinData.lastCheckin !== today) {
    checkinData.streak = 1;
  }

  checkinData.bestStreak = Math.max(checkinData.bestStreak, checkinData.streak);
  checkinData.lastCheckin = today;
  if (!checkinData.history.includes(today)) {
    checkinData.history.push(today);
  }

  // Apply reward
  const reward = getTodayReward();
  applyReward(reward);
  saveCheckinData();

  // Confetti
  spawnConfetti();

  // Check milestones
  checkMilestones();

  showToast(`🎉 签到成功！获得 ${reward.emoji} ${reward.name}！`);
  renderAll();
}

function applyReward(reward) {
  if (reward.type === 'coins') {
    const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
    wardrobe.coins = (wardrobe.coins || 0) + reward.amount;
    localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  } else if (reward.type === 'energy' || reward.type === 'mood') {
    // Will be applied to pet next time play.html loads
    const bonus = JSON.parse(localStorage.getItem('pw_daily_bonus') || '{}');
    bonus[reward.type] = (bonus[reward.type] || 0) + reward.amount;
    localStorage.setItem('pw_daily_bonus', JSON.stringify(bonus));
  }
}

function claimMilestone(m) {
  if (!checkinData.claimedMilestones) checkinData.claimedMilestones = [];
  if (checkinData.claimedMilestones.includes(m.days)) return;
  checkinData.claimedMilestones.push(m.days);
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  wardrobe.coins = (wardrobe.coins || 0) + m.coins;
  localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  saveCheckinData();
  spawnConfetti();
  showToast(`🏆 里程碑解锁！获得 ${m.reward}！`);
  renderMilestones();
}

function checkMilestones() {
  if (!checkinData.claimedMilestones) checkinData.claimedMilestones = [];
  MILESTONES.forEach(m => {
    if (checkinData.streak === m.days && !checkinData.claimedMilestones.includes(m.days)) {
      setTimeout(() => {
        showToast(`🎊 里程碑达成！点击领取 ${m.reward}！`);
        renderMilestones();
      }, 1500);
    }
  });
}

function spawnConfetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','💕','🧡','💛'];
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (10 + Math.random() * 80) + 'vw';
      el.style.top = (20 + Math.random() * 40) + 'vh';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }, i * 80);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

</script>
</body></html>
