<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 每日签到</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F97316; --orange-light: #FFF7ED; --orange-mid: #FED7AA;
    --purple: #8B5CF6; --purple-light: #EDE9FE;
    --green: #10B981; --green-light: #ECFDF5;
    --pink: #EC4899;
    --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-400: #9CA3AF;
    --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
    --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', sans-serif; background: #FFF9F5; min-height: 100vh; }
  body::before { content: ''; position: fixed; top: -100px; right: -100px; width: 350px; height: 350px; background: radial-gradient(circle, #FED7AA 0%, transparent 70%); z-index: 0; pointer-events: none; }
  body::after { content: ''; position: fixed; bottom: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, #DDD6FE 0%, transparent 70%); z-index: 0; pointer-events: none; }
  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 16px 100px; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pop { 0% { transform:scale(0.5); opacity:0; } 70% { transform:scale(1.15); } 100% { transform:scale(1); opacity:1; } }
  @keyframes confetti { 0% { transform:translateY(0) rotate(0); opacity:1; } 100% { transform:translateY(-120px) rotate(720deg); opacity:0; } }
  @keyframes shine { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); }
  .logo span { color: var(--purple); }
  .back-btn { background: white; border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 6px 14px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--gray-600); cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* Streak banner */
  .streak-banner { background: linear-gradient(135deg, #F97316, #EC4899); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; animation: fadeUp 0.4s ease; color: white; }
  .streak-left { display: flex; align-items: center; gap: 14px; }
  .streak-flame { font-size: 48px; animation: float 2s ease-in-out infinite; }
  .streak-num { font-family: 'Fredoka One', sans-serif; font-size: 42px; line-height: 1; }
  .streak-label { font-size: 13px; opacity: 0.85; font-weight: 700; margin-top: 2px; }
  .streak-right { text-align: right; }
  .streak-best { font-size: 12px; opacity: 0.7; font-weight: 700; }
  .streak-best-val { font-family: 'Fredoka One', sans-serif; font-size: 20px; }
  .streak-msg { font-size: 12px; opacity: 0.8; margin-top: 4px; max-width: 100px; text-align: right; line-height: 1.4; }

  /* Today's reward card */
  .today-card { background: white; border-radius: var(--radius-lg); padding: 20px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: fadeUp 0.4s ease 0.05s both; position: relative; overflow: hidden; }
  .today-title { font-family: 'Fredoka One', sans-serif; font-size: 18px; color: var(--gray-800); }
  .reward-preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .reward-emoji { font-size: 64px; animation: float 2.5s ease-in-out infinite; }
  .reward-name { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-700); }
  .reward-amount { font-family: 'Fredoka One', sans-serif; font-size: 28px; color: var(--orange); }
  .checkin-btn { width: 100%; background: linear-gradient(135deg, var(--orange), var(--pink)); color: white; border: none; border-radius: var(--radius-md); padding: 16px; font-family: 'Fredoka One', sans-serif; font-size: 20px; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 20px rgba(249,115,22,0.3); }
  .checkin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(249,115,22,0.4); }
  .checkin-btn:active { transform: scale(0.97); }
  .checkin-btn:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; transform: none; box-shadow: none; }
  .already-checked { background: var(--green-light); border: 1.5px solid #6EE7B7; border-radius: var(--radius-md); padding: 14px; width: 100%; text-align: center; }
  .already-checked-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--green); }
  .already-checked-sub { font-size: 12px; color: #065F46; margin-top: 4px; }
  .next-checkin { font-size: 12px; color: var(--gray-400); font-weight: 700; text-align: center; }

  /* 7-day calendar */
  .calendar-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; animation: fadeUp 0.4s ease 0.1s both; }
  .calendar-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); margin-bottom: 14px; }
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid var(--gray-200); background: var(--gray-100); transition: all 0.3s; }
  .day-circle.done { background: var(--orange); border-color: var(--orange); }
  .day-circle.today { background: var(--orange-light); border-color: var(--orange); border-width: 2.5px; animation: shine 1.5s ease-in-out infinite; }
  .day-circle.future { opacity: 0.5; }
  .day-circle.special { background: linear-gradient(135deg, #8B5CF6, #EC4899); border-color: transparent; }
  .day-label { font-size: 10px; color: var(--gray-400); font-weight: 700; }
  .day-reward { font-size: 9px; color: var(--orange); font-weight: 700; text-align: center; }

  /* Reward history */
  .history-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; animation: fadeUp 0.4s ease 0.15s both; }
  .history-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); margin-bottom: 12px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--gray-100); border-radius: var(--radius-sm); }
  .history-emoji { font-size: 24px; }
  .history-info { flex: 1; }
  .history-name { font-size: 13px; font-weight: 700; color: var(--gray-700); }
  .history-date { font-size: 11px; color: var(--gray-400); }
  .history-amount { font-family: 'Fredoka One', sans-serif; font-size: 15px; color: var(--orange); }

  /* Milestone rewards */
  .milestone-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); animation: fadeUp 0.4s ease 0.2s both; }
  .milestone-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); margin-bottom: 12px; }
  .milestone-list { display: flex; flex-direction: column; gap: 8px; }
  .milestone-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-200); transition: all 0.2s; }
  .milestone-item.achieved { background: var(--green-light); border-color: #6EE7B7; }
  .milestone-item.current { background: var(--orange-light); border-color: var(--orange); }
  .milestone-emoji { font-size: 28px; }
  .milestone-info { flex: 1; }
  .milestone-name { font-size: 13px; font-weight: 700; color: var(--gray-700); }
  .milestone-days { font-size: 11px; color: var(--gray-400); }
  .milestone-reward { font-family: 'Fredoka One', sans-serif; font-size: 14px; color: var(--orange); }
  .milestone-check { font-size: 20px; }

  /* Confetti */
  .confetti-piece { position: fixed; pointer-events: none; font-size: 20px; animation: confetti 1.2s ease forwards; z-index: 999; }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 500; display: none; font-family: 'Nunito', sans-serif; white-space: nowrap; }
  .toast.visible { display: block; animation: pop 0.3s ease; }

  .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: white; border-top: 1px solid var(--gray-200); display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; cursor: pointer; color: var(--gray-400); font-size: 10px; font-weight: 700; border: none; background: none; font-family: 'Nunito', sans-serif; text-decoration: none; transition: color 0.2s; }
  .nav-item.active { color: var(--orange); }
  .nav-icon { font-size: 22px; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div class="logo">Paw<span>World</span></div>
    
  </div>

  <!-- Streak banner -->
  <div class="streak-banner">
    <div class="streak-left">
      <div class="streak-flame">🔥</div>
      <div>
        <div class="streak-num" id="streak-num">0</div>
        <div class="streak-label">连续签到天数</div>
      </div>
    </div>
    <div class="streak-right">
      <div class="streak-best">历史最长</div>
      <div class="streak-best-val" id="streak-best">0 天</div>
      <div class="streak-msg" id="streak-msg">开始你的签到之旅！</div>
    </div>
  </div>

  <!-- Today's reward -->
  <div class="today-card" id="today-card">
    <div class="today-title">📅 今日签到奖励</div>
    <div class="reward-preview">
      <div class="reward-emoji" id="reward-emoji">🎁</div>
      <div class="reward-name" id="reward-name">加载中...</div>
      <div class="reward-amount" id="reward-amount"></div>
    </div>
    <button class="checkin-btn" id="checkin-btn" onclick="doCheckin()">✅ 立即签到！</button>
    <div class="already-checked" id="already-checked" style="display:none;">
      <div class="already-checked-title">✅ 今日已签到！</div>
      <div class="already-checked-sub" id="already-checked-sub">明天继续保持！</div>
    </div>
    <div class="next-checkin" id="next-checkin" style="display:none;"></div>
  </div>

  <!-- 7-day calendar -->
  <div class="calendar-card">
    <div class="calendar-title">🗓️ 本周签到</div>
    <div class="days-grid" id="days-grid"></div>
  </div>

  <!-- Milestone rewards -->
  <div class="milestone-card">
    <div class="milestone-title">🏆 连签里程碑</div>
    <div class="milestone-list" id="milestone-list"></div>
  </div>

  <!-- History -->
  <div class="history-card">
    <div class="history-title">📋 签到记录</div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="nav-bar">
  <a href="/play.html" class="nav-item "><div class="nav-icon">🎮</div>互动</a>
  <a href="/wardrobe.html" class="nav-item "><div class="nav-icon">👗</div>衣橱</a>
  <a href="/checkin.html" class="nav-item active"><div class="nav-icon">📅</div>签到</a>
  <a href="/milestone.html" class="nav-item "><div class="nav-icon">🏆</div>成长</a>
  <a href="/profile.html" class="nav-item "><div class="nav-icon">👤</div>我的</a>
</div>

<script>
// Daily rewards by streak day (cycles every 7 days)
const DAILY_REWARDS = [
  { emoji: '🪙', name: '游戏积分', amount: 30, type: 'coins' },
  { emoji: '🍖', name: '肉骨头 x3', amount: 3, type: 'food', foodId: 'bone' },
  { emoji: '🪙', name: '游戏积分', amount: 50, type: 'coins' },
  { emoji: '⚡', name: '活力恢复', amount: 30, type: 'energy' },
  { emoji: '🪙', name: '游戏积分', amount: 80, type: 'coins' },
  { emoji: '😊', name: '心情大涨', amount: 40, type: 'mood' },
  { emoji: '🎁', name: '大礼包！积分+100', amount: 100, type: 'coins', special: true },
];

const MILESTONES = [
  { days: 3,  emoji: '🌱', name: '初出茅庐', reward: '积分 +50',  coins: 50 },
  { days: 7,  emoji: '🌟', name: '坚持一周', reward: '积分 +150', coins: 150 },
  { days: 14, emoji: '🔥', name: '热情不减', reward: '积分 +300', coins: 300 },
  { days: 30, emoji: '💎', name: '签到达人', reward: '积分 +500', coins: 500 },
  { days: 60, emoji: '👑', name: '传说级主人', reward: '积分 +1000', coins: 1000 },
];

// State
let checkinData = {
  streak: 0,
  bestStreak: 0,
  lastCheckin: null,
  history: [],
  claimedMilestones: []
};

window.addEventListener('load', () => {
  loadCheckinData();
  renderAll();
});

function loadCheckinData() {
  const saved = localStorage.getItem('pw_checkin');
  if (saved) {
    try { checkinData = { ...checkinData, ...JSON.parse(saved) }; } catch {}
  }
}

function saveCheckinData() {
  localStorage.setItem('pw_checkin', JSON.stringify(checkinData));
}

function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

function getYesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function isCheckedToday() {
  return checkinData.lastCheckin === getTodayStr();
}

function getTimeUntilMidnight() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const diff = midnight - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `${h} 小时 ${m} 分钟后`;
}

function getTodayReward() {
  const idx = checkinData.streak % 7;
  return DAILY_REWARDS[idx];
}

function renderAll() {
  renderStreak();
  renderTodayCard();
  renderCalendar();
  renderMilestones();
  renderHistory();
}

function renderStreak() {
  document.getElementById('streak-num').textContent = checkinData.streak;
  document.getElementById('streak-best').textContent = checkinData.bestStreak + ' 天';
  const msgs = [
    '开始你的签到之旅！',
    '好的开始！继续加油！',
    '连续 2 天！棒棒哒！',
    '快到 3 天里程碑了！',
    '半周了！你很棒！',
    '5 天了！再坚持！',
    '6 天！明天就一周！',
    '🎉 连续一周！超厉害！',
  ];
  const msg = msgs[Math.min(checkinData.streak, msgs.length - 1)];
  document.getElementById('streak-msg').textContent = msg;
}

function renderTodayCard() {
  const reward = getTodayReward();
  document.getElementById('reward-emoji').textContent = reward.emoji;
  document.getElementById('reward-name').textContent = reward.name;
  document.getElementById('reward-amount').textContent = reward.special ? '🎊 特别奖励！' : '';

  if (isCheckedToday()) {
    document.getElementById('checkin-btn').style.display = 'none';
    document.getElementById('already-checked').style.display = 'block';
    document.getElementById('next-checkin').style.display = 'block';
    document.getElementById('next-checkin').textContent = `⏰ ${getTimeUntilMidnight()}后可再次签到`;
    document.getElementById('already-checked-sub').textContent =
      checkinData.streak >= 7 ? `🔥 已连续签到 ${checkinData.streak} 天，太厉害了！` :
      `还差 ${7 - checkinData.streak % 7} 天领取大礼包！`;
  } else {
    document.getElementById('checkin-btn').style.display = 'block';
    document.getElementById('already-checked').style.display = 'none';
    document.getElementById('next-checkin').style.display = 'none';
  }
}

function renderCalendar() {
  const grid = document.getElementById('days-grid');
  grid.innerHTML = '';
  const today = new Date();
  const dayNames = ['日','一','二','三','四','五','六'];

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    const isToday = i === 0;
    const isDone = checkinData.history.includes(dateStr);
    const rewardIdx = (checkinData.streak - i + 7) % 7;
    const reward = DAILY_REWARDS[Math.max(0, rewardIdx)];

    const div = document.createElement('div');
    div.className = 'day-item';
    const circleClass = isDone ? 'done' : isToday ? 'today' : i < 0 ? 'future' : '';
    div.innerHTML = `
      <div class="day-circle ${circleClass}">${isDone ? '✅' : isToday ? '📅' : reward.emoji}</div>
      <div class="day-label">${dayNames[d.getDay()]}</div>
      <div class="day-reward">${isDone ? '' : reward.type === 'coins' ? `+${reward.amount}` : reward.emoji}</div>
    `;
    grid.appendChild(div);
  }
}

function renderMilestones() {
  const list = document.getElementById('milestone-list');
  list.innerHTML = '';
  MILESTONES.forEach(m => {
    const achieved = checkinData.streak >= m.days;
    const claimed = checkinData.claimedMilestones?.includes(m.days);
    const isCurrent = checkinData.streak >= m.days - 2 && checkinData.streak < m.days + 3;
    const item = document.createElement('div');
    item.className = 'milestone-item' + (achieved ? ' achieved' : isCurrent ? ' current' : '');
    item.innerHTML = `
      <div class="milestone-emoji">${m.emoji}</div>
      <div class="milestone-info">
        <div class="milestone-name">${m.name}</div>
        <div class="milestone-days">连续签到 ${m.days} 天</div>
      </div>
      <div class="milestone-reward">${m.reward}</div>
      <div class="milestone-check">${claimed ? '✅' : achieved ? '🎁' : checkinData.streak >= m.days - 3 ? '🔜' : '🔒'}</div>
    `;
    if (achieved && !claimed) {
      item.style.cursor = 'pointer';
      item.onclick = () => claimMilestone(m);
    }
    list.appendChild(item);
  });
}

function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  const recent = [...checkinData.history].reverse().slice(0, 5);
  if (recent.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:12px;">还没有签到记录，快去签到吧！</div>';
    return;
  }
  recent.forEach((dateStr, i) => {
    const rewardIdx = i % 7;
    const reward = DAILY_REWARDS[rewardIdx];
    const item = document.createElement('div');
    item.className = 'history-item';
    const date = new Date(dateStr);
    const label = i === 0 ? '今天' : i === 1 ? '昨天' : dateStr;
    item.innerHTML = `
      <div class="history-emoji">${reward.emoji}</div>
      <div class="history-info">
        <div class="history-name">${reward.name}</div>
        <div class="history-date">${label}</div>
      </div>
      <div class="history-amount">${reward.type === 'coins' ? '+' + reward.amount + '🪙' : reward.emoji}</div>
    `;
    list.appendChild(item);
  });
}

function doCheckin() {
  if (isCheckedToday()) return;
  const today = getTodayStr();
  const yesterday = getYesterdayStr();

  // Update streak
  if (checkinData.lastCheckin === yesterday) {
    checkinData.streak++;
  } else if (checkinData.lastCheckin !== today) {
    checkinData.streak = 1;
  }

  checkinData.bestStreak = Math.max(checkinData.bestStreak, checkinData.streak);
  checkinData.lastCheckin = today;
  if (!checkinData.history.includes(today)) {
    checkinData.history.push(today);
  }

  // Apply reward
  const reward = getTodayReward();
  applyReward(reward);
  saveCheckinData();

  // Confetti
  spawnConfetti();

  // Check milestones
  checkMilestones();

  showToast(`🎉 签到成功！获得 ${reward.emoji} ${reward.name}！`);
  renderAll();
}

function applyReward(reward) {
  if (reward.type === 'coins') {
    const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
    wardrobe.coins = (wardrobe.coins || 0) + reward.amount;
    localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  } else if (reward.type === 'energy' || reward.type === 'mood') {
    // Will be applied to pet next time play.html loads
    const bonus = JSON.parse(localStorage.getItem('pw_daily_bonus') || '{}');
    bonus[reward.type] = (bonus[reward.type] || 0) + reward.amount;
    localStorage.setItem('pw_daily_bonus', JSON.stringify(bonus));
  }
}

function claimMilestone(m) {
  if (!checkinData.claimedMilestones) checkinData.claimedMilestones = [];
  if (checkinData.claimedMilestones.includes(m.days)) return;
  checkinData.claimedMilestones.push(m.days);
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  wardrobe.coins = (wardrobe.coins || 0) + m.coins;
  localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  saveCheckinData();
  spawnConfetti();
  showToast(`🏆 里程碑解锁！获得 ${m.reward}！`);
  renderMilestones();
}

function checkMilestones() {
  if (!checkinData.claimedMilestones) checkinData.claimedMilestones = [];
  MILESTONES.forEach(m => {
    if (checkinData.streak === m.days && !checkinData.claimedMilestones.includes(m.days)) {
      setTimeout(() => {
        showToast(`🎊 里程碑达成！点击领取 ${m.reward}！`);
        renderMilestones();
      }, 1500);
    }
  });
}

function spawnConfetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','💕','🧡','💛'];
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (10 + Math.random() * 80) + 'vw';
      el.style.top = (20 + Math.random() * 40) + 'vh';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }, i * 80);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}
</script>
</body>
