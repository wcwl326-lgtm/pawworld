<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 成长里程碑</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F97316; --orange-light: #FFF7ED; --orange-mid: #FED7AA;
    --purple: #8B5CF6; --purple-light: #EDE9FE;
    --green: #10B981; --green-light: #ECFDF5;
    --pink: #EC4899; --pink-light: #FDF2F8;
    --blue: #3B82F6; --blue-light: #EFF6FF;
    --yellow: #F59E0B; --yellow-light: #FFFBEB;
    --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-400: #9CA3AF;
    --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
    --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', sans-serif; background: #FFF9F5; min-height: 100vh; }
  body::before { content: ''; position: fixed; top: -100px; right: -100px; width: 350px; height: 350px; background: radial-gradient(circle, #FED7AA 0%, transparent 70%); z-index: 0; pointer-events: none; }
  body::after { content: ''; position: fixed; bottom: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, #DDD6FE 0%, transparent 70%); z-index: 0; pointer-events: none; }
  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 16px 100px; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes pop { 0% { transform:scale(0.5); opacity:0; } 70% { transform:scale(1.1); } 100% { transform:scale(1); opacity:1; } }
  @keyframes shine { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
  @keyframes confetti { 0% { transform:translateY(0) rotate(0); opacity:1; } 100% { transform:translateY(-100px) rotate(720deg); opacity:0; } }
  @keyframes glow { 0%,100% { box-shadow:0 0 10px rgba(249,115,22,0.3); } 50% { box-shadow:0 0 24px rgba(249,115,22,0.7); } }
  @keyframes progressFill { from { width:0%; } to { width:var(--target-w); } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); }
  .logo span { color: var(--purple); }
  .back-btn { background: white; border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 6px 14px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--gray-600); cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* Hero card */
  .hero-card { background: white; border-radius: var(--radius-lg); padding: 20px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; display: flex; gap: 16px; align-items: center; animation: fadeUp 0.4s ease; position: relative; overflow: hidden; }
  .hero-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #FFF7ED 0%, #EDE9FE 100%); opacity: 0.5; }
  .hero-pet { position: relative; z-index: 1; flex-shrink: 0; }
  .hero-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid var(--orange); animation: float 3s ease-in-out infinite; }
  .hero-emoji { font-size: 60px; animation: float 3s ease-in-out infinite; }
  .hero-info { flex: 1; position: relative; z-index: 1; }
  .hero-name { font-family: 'Fredoka One', sans-serif; font-size: 20px; color: var(--gray-800); }
  .hero-title { font-size: 12px; color: var(--purple); font-weight: 700; margin-top: 2px; }
  .level-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .level-badge { background: var(--purple); color: white; font-family: 'Fredoka One', sans-serif; font-size: 14px; padding: 3px 12px; border-radius: 20px; }
  .exp-info { font-size: 11px; color: var(--gray-400); font-weight: 700; }
  .exp-bar-bg { width: 100%; height: 8px; background: var(--gray-100); border-radius: 10px; overflow: hidden; margin-top: 6px; }
  .exp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); border-radius: 10px; transition: width 0.8s ease; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; animation: fadeUp 0.4s ease 0.05s both; }
  .stat-card { background: white; border-radius: var(--radius-md); padding: 14px 10px; text-align: center; border: 1.5px solid var(--gray-200); }
  .stat-val { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); }
  .stat-label { font-size: 10px; color: var(--gray-400); font-weight: 700; margin-top: 2px; }

  /* Timeline */
  .timeline-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; animation: fadeUp 0.4s ease 0.1s both; }
  .section-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); margin-bottom: 16px; }
  .timeline { position: relative; }
  .timeline::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: var(--gray-200); }
  .timeline-item { display: flex; gap: 14px; margin-bottom: 14px; position: relative; }
  .timeline-item:last-child { margin-bottom: 0; }
  .tl-dot { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; position: relative; z-index: 1; border: 3px solid white; transition: all 0.3s; }
  .tl-dot.achieved { animation: glow 2s ease-in-out infinite; }
  .tl-dot.locked { filter: grayscale(0.7); opacity: 0.6; }
  .tl-dot.next { animation: shine 1.5s ease-in-out infinite; }
  .tl-content { flex: 1; padding-top: 4px; }
  .tl-title { font-family: 'Fredoka One', sans-serif; font-size: 14px; color: var(--gray-800); display: flex; align-items: center; gap: 6px; }
  .tl-level { font-size: 10px; color: var(--gray-400); font-weight: 700; margin-top: 2px; }
  .tl-reward { font-size: 12px; color: var(--orange); font-weight: 700; margin-top: 4px; }
  .tl-unlocks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .unlock-tag { background: var(--gray-100); color: var(--gray-600); font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .unlock-tag.active { background: var(--orange-light); color: var(--orange); }
  .achieved-badge { background: var(--green); color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 800; }
  .next-badge { background: var(--orange-light); color: var(--orange); font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 800; }
  .tl-progress { margin-top: 6px; }
  .tl-progress-bg { width: 100%; height: 5px; background: var(--gray-100); border-radius: 10px; overflow: hidden; }
  .tl-progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--orange), var(--pink)); }

  /* Achievements */
  .achievements-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; animation: fadeUp 0.4s ease 0.15s both; }
  .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ach-item { background: var(--gray-100); border-radius: var(--radius-sm); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; border: 1.5px solid transparent; transition: all 0.2s; }
  .ach-item.unlocked { background: var(--orange-light); border-color: var(--orange-mid); }
  .ach-item.unlocked .ach-emoji { filter: none; }
  .ach-emoji { font-size: 28px; filter: grayscale(0.8) opacity(0.5); transition: filter 0.3s; }
  .ach-name { font-family: 'Fredoka One', sans-serif; font-size: 11px; color: var(--gray-700); }
  .ach-desc { font-size: 9px; color: var(--gray-400); line-height: 1.4; }

  /* Claim button */
  .claim-btn { background: var(--orange); color: white; border: none; border-radius: 10px; padding: 6px 14px; font-family: 'Fredoka One', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
  .claim-btn:hover { background: #EA6C0A; transform: scale(1.05); }

  /* Confetti */
  .confetti-piece { position: fixed; pointer-events: none; font-size: 18px; animation: confetti 1.2s ease forwards; z-index: 999; }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 500; display: none; font-family: 'Nunito', sans-serif; }
  .toast.visible { display: block; animation: pop 0.3s ease; }

  .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: white; border-top: 1px solid var(--gray-200); display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; cursor: pointer; color: var(--gray-400); font-size: 10px; font-weight: 700; border: none; background: none; font-family: 'Nunito', sans-serif; text-decoration: none; transition: color 0.2s; }
  .nav-item.active { color: var(--orange); }
  .nav-icon { font-size: 22px; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div class="logo">Paw<span>World</span></div>
    
  </div>

  <!-- Hero card -->
  <div class="hero-card" id="hero-card">
    <div class="hero-pet">
      <img id="hero-img" src="" alt="宠物" class="hero-img" style="display:none;">
      <div id="hero-emoji" class="hero-emoji">🐾</div>
    </div>
    <div class="hero-info">
      <div class="hero-name" id="hero-name">加载中...</div>
      <div class="hero-title" id="hero-title">🌱 小宠物</div>
      <div class="level-row">
        <div class="level-badge" id="level-badge">Lv.1</div>
        <div class="exp-info" id="exp-info">0 / 100 经验</div>
      </div>
      <div class="exp-bar-bg">
        <div class="exp-bar-fill" id="exp-bar" style="width:0%;"></div>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-days">0</div>
      <div class="stat-label">陪伴天数</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-games">0</div>
      <div class="stat-label">游戏积分</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-checkin">0</div>
      <div class="stat-label">签到天数</div>
    </div>
  </div>

  <!-- Level timeline -->
  <div class="timeline-card">
    <div class="section-title">🗺️ 成长里程碑</div>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- Achievements -->
  <div class="achievements-card">
    <div class="section-title">🏅 成就徽章</div>
    <div class="ach-grid" id="ach-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="nav-bar">
  <a href="/play.html" class="nav-item "><div class="nav-icon">🎮</div>互动</a>
  <a href="/wardrobe.html" class="nav-item "><div class="nav-icon">👗</div>衣橱</a>
  <a href="/checkin.html" class="nav-item "><div class="nav-icon">📅</div>签到</a>
  <a href="/milestone.html" class="nav-item active"><div class="nav-icon">🏆</div>成长</a>
  <a href="/profile.html" class="nav-item "><div class="nav-icon">👤</div>我的</a>
</div>

<script>
// Level milestones definition
const LEVELS = [
  { level: 1,  title: '小宠物',    emoji: '🌱', color: '#10B981', bg: '#ECFDF5', exp: 100,  reward: '解锁基础食物', coins: 0,   unlocks: ['基础喂食', '基础互动'] },
  { level: 2,  title: '活泼小家伙', emoji: '⭐', color: '#F59E0B', bg: '#FFFBEB', exp: 200,  reward: '积分 +50',     coins: 50,  unlocks: ['AI 对话', '更多食物'] },
  { level: 3,  title: '快乐萌宠',  emoji: '🌟', color: '#3B82F6', bg: '#EFF6FF', exp: 350,  reward: '积分 +80',     coins: 80,  unlocks: ['衣橱系统', '记忆配对游戏'] },
  { level: 4,  title: '聪明宝贝',  emoji: '💫', color: '#8B5CF6', bg: '#EDE9FE', exp: 500,  reward: '积分 +120',    coins: 120, unlocks: ['跑酷游戏', '水果忍者'] },
  { level: 5,  title: '活力达人',  emoji: '🔥', color: '#F97316', bg: '#FFF7ED', exp: 750,  reward: '积分 +200',    coins: 200, unlocks: ['消消乐', '高级配件解锁'] },
  { level: 6,  title: '游戏高手',  emoji: '🎮', color: '#EC4899', bg: '#FDF2F8', exp: 1000, reward: '积分 +300',    coins: 300, unlocks: ['限定帽子 👑', '宠物特效'] },
  { level: 7,  title: '宠物明星',  emoji: '🌈', color: '#06B6D4', bg: '#ECFEFF', exp: 1500, reward: '积分 +400',    coins: 400, unlocks: ['彩虹特效', '明星称号'] },
  { level: 8,  title: '传奇宠物',  emoji: '💎', color: '#7C3AED', bg: '#F5F3FF', exp: 2000, reward: '积分 +600',    coins: 600, unlocks: ['钻石边框', '传奇称号'] },
  { level: 9,  title: '神话宠物',  emoji: '👑', color: '#D97706', bg: '#FFFBEB', exp: 3000, reward: '积分 +1000',   coins: 1000,unlocks: ['皇冠特效', '神话称号'] },
  { level: 10, title: '宠物之神',  emoji: '🌠', color: '#BE185D', bg: '#FDF2F8', exp: 5000, reward: '积分 +2000',   coins: 2000,unlocks: ['全部解锁！', '终极称号'] },
];

// Achievements definition
const ACHIEVEMENTS = [
  { id: 'first_gen',   emoji: '📸', name: '初次见面',   desc: '生成第一个卡通形象',   check: (d) => d.pet !== null },
  { id: 'first_feed',  emoji: '🍖', name: '爱的喂食',   desc: '第一次喂食宠物',        check: (d) => (d.pet?.hunger||0) < 100 },
  { id: 'first_game',  emoji: '🎮', name: '游戏初体验', desc: '第一次玩游戏',          check: (d) => d.totalScore > 0 },
  { id: 'streak3',     emoji: '🔥', name: '三日不间断', desc: '连续签到 3 天',          check: (d) => d.streak >= 3 },
  { id: 'streak7',     emoji: '💪', name: '坚持一周',   desc: '连续签到 7 天',          check: (d) => d.streak >= 7 },
  { id: 'level3',      emoji: '⭐', name: '成长中',     desc: '宠物升到 Lv.3',          check: (d) => (d.pet?.level||1) >= 3 },
  { id: 'level5',      emoji: '🌟', name: '实力派',     desc: '宠物升到 Lv.5',          check: (d) => (d.pet?.level||1) >= 5 },
  { id: 'coins100',    emoji: '🪙', name: '小富翁',     desc: '累计获得 100 积分',      check: (d) => d.totalCoinsEarned >= 100 },
  { id: 'coins500',    emoji: '💰', name: '积分大户',   desc: '累计获得 500 积分',      check: (d) => d.totalCoinsEarned >= 500 },
  { id: 'dodge100',    emoji: '🏃', name: '闪避高手',   desc: '跑酷得分超过 100',       check: (d) => (d.scores.runner||0) >= 100 },
  { id: 'fruit20',     emoji: '🍉', name: '水果忍者',   desc: '水果忍者得分超过 20',    check: (d) => (d.scores.fruit||0) >= 20 },
  { id: 'candy500',    emoji: '🍬', name: '消消高手',   desc: '消消乐得分超过 500',     check: (d) => (d.scores.candy||0) >= 500 },
];

let pet = null;
let claimedLevels = new Set();

window.addEventListener('load', async () => {
  claimedLevels = new Set(JSON.parse(localStorage.getItem('pw_claimed_levels') || '[]'));
  await loadData();
  renderAll();
});

async function loadData() {
  const session = localStorage.getItem('pw_session');
  if (!session) return;
  try {
    const s = JSON.parse(session);
    if (s.token) {
      const res = await fetch('/api/pet', { headers: { 'Authorization': 'Bearer ' + s.token } });
      const data = await res.json();
      if (data.pet) pet = data.pet;
    }
  } catch {}
}

function renderAll() {
  renderHero();
  renderStats();
  renderTimeline();
  renderAchievements();
}

function renderHero() {
  if (!pet) return;
  const level = pet.level || 1;
  const exp = pet.exp || 0;
  const lv = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
  const nextLv = LEVELS[Math.min(level, LEVELS.length - 1)];
  const expNeeded = nextLv.exp;
  const pct = Math.min(100, Math.floor((exp / expNeeded) * 100));

  if (pet.cartoon_url) {
    const img = document.getElementById('hero-img');
    img.src = pet.cartoon_url;
    img.style.display = 'block';
    document.getElementById('hero-emoji').style.display = 'none';
  }
  document.getElementById('hero-name').textContent = pet.name;
  document.getElementById('hero-title').textContent = lv.emoji + ' ' + lv.title;
  document.getElementById('level-badge').textContent = 'Lv.' + level;
  document.getElementById('exp-info').textContent = `${exp} / ${expNeeded} 经验`;
  setTimeout(() => {
    document.getElementById('exp-bar').style.width = pct + '%';
  }, 300);
}

function renderStats() {
  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalScore = (scores.dodge||0) + (scores.memory||0) + (scores.tap||0) + (scores.runner||0) + (scores.fruit||0) + (scores.candy||0);
  const firstVisit = localStorage.getItem('pw_first_visit');
  if (!firstVisit) localStorage.setItem('pw_first_visit', Date.now().toString());
  const days = firstVisit ? Math.floor((Date.now() - parseInt(firstVisit)) / 86400000) + 1 : 1;

  document.getElementById('stat-days').textContent = days;
  document.getElementById('stat-games').textContent = totalScore;
  document.getElementById('stat-checkin').textContent = checkinData.streak || 0;
}

function renderTimeline() {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  const level = pet?.level || 1;
  const exp = pet?.exp || 0;

  LEVELS.forEach((lv, i) => {
    const isAchieved = level > lv.level;
    const isCurrent = level === lv.level;
    const isNext = level === lv.level - 1;
    const isClaimed = claimedLevels.has(lv.level);
    const canClaim = isAchieved && !isClaimed && lv.coins > 0;

    const item = document.createElement('div');
    item.className = 'timeline-item';

    const dotClass = isAchieved ? 'achieved' : isCurrent ? 'next' : 'locked';
    const dotStyle = `background:${isAchieved || isCurrent ? lv.bg : '#F3F4F6'}; border-color:${isAchieved || isCurrent ? lv.color : '#E5E7EB'};`;

    let progressHtml = '';
    if (isCurrent) {
      const pct = Math.min(100, Math.floor((exp / lv.exp) * 100));
      progressHtml = `<div class="tl-progress"><div class="tl-progress-bg"><div class="tl-progress-fill" style="width:${pct}%"></div></div><div style="font-size:10px;color:var(--gray-400);margin-top:3px;">${exp}/${lv.exp} 经验 (${pct}%)</div></div>`;
    }

    const unlocksHtml = lv.unlocks.map(u =>
      `<span class="unlock-tag ${isAchieved || isCurrent ? 'active' : ''}">${u}</span>`
    ).join('');

    const badgeHtml = isAchieved
      ? `<span class="achieved-badge">✓ 已达成</span>`
      : isCurrent ? `<span class="next-badge">当前等级</span>` : '';

    const claimHtml = canClaim
      ? `<button class="claim-btn" onclick="claimLevelReward(${lv.level}, ${lv.coins})">领取奖励 🪙${lv.coins}</button>`
      : '';

    item.innerHTML = `
      <div class="tl-dot ${dotClass}" style="${dotStyle}">${lv.emoji}</div>
      <div class="tl-content">
        <div class="tl-title">Lv.${lv.level} ${lv.title} ${badgeHtml}</div>
        <div class="tl-level">需要 ${lv.exp} 经验值</div>
        <div class="tl-reward">🎁 ${lv.reward}</div>
        <div class="tl-unlocks">${unlocksHtml}</div>
        ${progressHtml}
        ${claimHtml}
      </div>
    `;
    timeline.appendChild(item);
  });
}

function renderAchievements() {
  const grid = document.getElementById('ach-grid');
  grid.innerHTML = '';

  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalCoins = (scores.dodge||0) + (scores.memory||0) + (scores.tap||0) + (scores.runner||0);
  const gameData = { pet, streak: checkinData.streak||0, totalScore: Object.values(scores).reduce((a,b)=>a+b,0), totalCoinsEarned: totalCoins, scores };

  ACHIEVEMENTS.forEach(ach => {
    const isUnlocked = ach.check(gameData);
    const item = document.createElement('div');
    item.className = 'ach-item' + (isUnlocked ? ' unlocked' : '');
    item.innerHTML = `
      <div class="ach-emoji">${ach.emoji}</div>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-desc">${ach.desc}</div>
    `;
    grid.appendChild(item);
  });
}

function claimLevelReward(level, coins) {
  claimedLevels.add(level);
  localStorage.setItem('pw_claimed_levels', JSON.stringify([...claimedLevels]));
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  wardrobe.coins = (wardrobe.coins || 0) + coins;
  localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  spawnConfetti();
  showToast(`🎉 领取成功！获得 🪙${coins} 积分！`);
  renderTimeline();
}

function spawnConfetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','💕','🧡','💛','🏆'];
  for (let i = 0; i < 16; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (10 + Math.random() * 80) + 'vw';
      el.style.top = (10 + Math.random() * 50) + 'vh';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }, i * 60);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}
</script>
</body>
</html>
