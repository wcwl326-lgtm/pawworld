<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 成长里程碑</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Quicksand:wght@700&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "primary":"#02677f","primary-container":"#7ec8e3","on-primary":"#ffffff","on-primary-container":"#005468",
        "primary-fixed":"#b7eaff","primary-fixed-dim":"#87d1ec",
        "secondary":"#705d00","secondary-container":"#fdd73b","on-secondary-container":"#715d00",
        "tertiary":"#2d6a44","tertiary-container":"#8dcc9f","on-tertiary-container":"#185834","tertiary-fixed":"#b0f1c2",
        "surface":"#fff9f0","surface-bright":"#fff9f0","surface-container-low":"#f9f3ea",
        "surface-container":"#f3ede4","surface-container-high":"#ede7df","surface-container-highest":"#e7e2d9",
        "on-surface":"#1d1b16","on-surface-variant":"#3f484c",
        "outline":"#6f787d","outline-variant":"#bfc8cd",
      },
      borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
      spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"40px","xl":"64px","gutter":"16px","container-padding":"20px"},
      fontFamily:{"sans":["Be Vietnam Pro","sans-serif"],"display":["Plus Jakarta Sans","sans-serif"],"label":["Quicksand","sans-serif"]}
    }
  }
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .soft-pop{box-shadow:inset 0 2px 4px rgba(255,255,255,0.4),0 4px 12px rgba(2,103,127,0.15);}
  .squishy:active{transform:scale(0.95) translateY(2px);box-shadow:none!important;}
  body{background-color:#fff9f0;min-height:100dvh;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
  .animate-float{animation:float 3s ease-in-out infinite;}
  .animate-fade-up{animation:fadeUp 0.4s ease both;}
</style>

<style>
.timeline-line{background:repeating-linear-gradient(to bottom,#7ec8e3 0,#7ec8e3 8px,transparent 8px,transparent 16px);}
</style>
</head>
<body class="font-sans text-on-surface">
<div class="fixed inset-0 z-0 opacity-30 pointer-events-none" style="background:radial-gradient(ellipse at 20% 20%,#b7eaff 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#b0f1c2 0%,transparent 50%);"></div>

<header class="fixed top-0 w-full z-50 bg-surface-bright/80 backdrop-blur-md">
  <div class="flex justify-between items-center px-container-padding py-sm w-full max-w-lg mx-auto">
    <h1 class="font-display font-extrabold text-xl text-primary">PawWorld</h1>
    <div class="bg-secondary-container px-sm py-xs rounded-full flex items-center gap-xs soft-pop">
      <span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings:'FILL' 1;">pets</span>
      <span class="font-display font-bold text-sm text-on-secondary-container" id="coins-display">0 积分</span>
    </div>
  </div>
</header>

<main class="relative z-10 pt-20 pb-28 px-container-padding max-w-lg mx-auto">

  <!-- Hero: Level card -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop mb-md border border-white animate-fade-up">
    <div class="flex items-center gap-md mb-md">
      <div id="hero-pet-img" class="w-16 h-16 rounded-2xl bg-primary-container flex items-center justify-center text-3xl overflow-hidden soft-pop animate-float">🐾</div>
      <div class="flex-1">
        <div class="font-display font-extrabold text-xl text-primary" id="hero-name">加载中...</div>
        <div class="text-xs text-on-surface-variant font-label" id="hero-title">🌱 小宠物</div>
        <div class="flex items-center gap-sm mt-1">
          <div class="bg-primary text-white px-sm py-xs rounded-full font-display font-bold text-xs" id="level-badge">Lv.1</div>
          <div class="text-xs text-on-surface-variant" id="exp-info">0/100 经验</div>
        </div>
      </div>
    </div>
    <div class="h-4 w-full bg-surface-container-highest rounded-full overflow-hidden p-0.5">
      <div class="h-full bg-gradient-to-r from-primary-container to-primary rounded-full transition-all duration-700" id="exp-bar" style="width:0%"></div>
    </div>
  </div>

  <!-- Stats row -->
  <div class="grid grid-cols-3 gap-sm mb-md animate-fade-up" style="animation-delay:0.05s">
    <div class="bg-white/80 backdrop-blur rounded-2xl p-sm soft-pop border border-white text-center">
      <div class="font-display font-extrabold text-2xl text-primary" id="stat-days">0</div>
      <div class="font-label text-[10px] text-on-surface-variant font-bold mt-0.5">陪伴天数</div>
    </div>
    <div class="bg-white/80 backdrop-blur rounded-2xl p-sm soft-pop border border-white text-center">
      <div class="font-display font-extrabold text-2xl text-secondary" id="stat-games">0</div>
      <div class="font-label text-[10px] text-on-surface-variant font-bold mt-0.5">游戏积分</div>
    </div>
    <div class="bg-white/80 backdrop-blur rounded-2xl p-sm soft-pop border border-white text-center">
      <div class="font-display font-extrabold text-2xl text-tertiary" id="stat-checkin">0</div>
      <div class="font-label text-[10px] text-on-surface-variant font-bold mt-0.5">签到天数</div>
    </div>
  </div>

  <!-- Timeline -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop mb-md border border-white animate-fade-up" style="animation-delay:0.1s">
    <h3 class="font-display font-bold text-lg text-on-surface mb-md flex items-center gap-2">
      <span class="material-symbols-outlined text-primary" style="font-variation-settings:'FILL' 1;">route</span>
      成长里程碑
    </h3>
    <div class="relative pl-8" id="timeline"><!-- filled by JS --></div>
  </div>

  <!-- Achievements -->
  <div class="bg-white/80 backdrop-blur rounded-2xl p-md soft-pop border border-white animate-fade-up" style="animation-delay:0.15s">
    <h3 class="font-display font-bold text-lg text-on-surface mb-md flex items-center gap-2">
      <span class="material-symbols-outlined text-secondary" style="font-variation-settings:'FILL' 1;">military_tech</span>
      成就徽章
    </h3>
    <div class="grid grid-cols-3 gap-sm" id="ach-grid"><!-- filled by JS --></div>
  </div>
</main>

<div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-5 py-3 rounded-full text-sm font-bold z-[500] hidden shadow-lg"></div>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter pb-4 bg-surface-container-low shadow-[0_-4px_10px_rgba(2,103,127,0.08)] rounded-t-2xl">
  <a href="/play.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">home</span><span class="font-label text-[10px] font-bold">互动</span></a>
  <a href="/wardrobe.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">styler</span><span class="font-label text-[10px] font-bold">衣橱</span></a>
  <a href="/checkin.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">calendar_today</span><span class="font-label text-[10px] font-bold">签到</span></a>
  <a href="/milestone.html" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 scale-105"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">emoji_events</span><span class="font-label text-[10px] font-bold">成长</span></a>
  <a href="/profile.html" class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-xl"><span class="material-symbols-outlined">person</span><span class="font-label text-[10px] font-bold">我的</span></a>
</nav>
<script>

// Level milestones definition
const LEVELS = [
  { level: 1,  title: '小宠物',    emoji: '🌱', color: '#10B981', bg: '#ECFDF5', exp: 100,  reward: '解锁基础食物', coins: 0,   unlocks: ['基础喂食', '基础互动'] },
  { level: 2,  title: '活泼小家伙', emoji: '⭐', color: '#F59E0B', bg: '#FFFBEB', exp: 200,  reward: '积分 +50',     coins: 50,  unlocks: ['AI 对话', '更多食物'] },
  { level: 3,  title: '快乐萌宠',  emoji: '🌟', color: '#3B82F6', bg: '#EFF6FF', exp: 350,  reward: '积分 +80',     coins: 80,  unlocks: ['衣橱系统', '记忆配对游戏'] },
  { level: 4,  title: '聪明宝贝',  emoji: '💫', color: '#8B5CF6', bg: '#EDE9FE', exp: 500,  reward: '积分 +120',    coins: 120, unlocks: ['跑酷游戏', '水果忍者'] },
  { level: 5,  title: '活力达人',  emoji: '🔥', color: '#F97316', bg: '#FFF7ED', exp: 750,  reward: '积分 +200',    coins: 200, unlocks: ['消消乐', '高级配件解锁'] },
  { level: 6,  title: '游戏高手',  emoji: '🎮', color: '#EC4899', bg: '#FDF2F8', exp: 1000, reward: '积分 +300',    coins: 300, unlocks: ['限定帽子 👑', '宠物特效'] },
  { level: 7,  title: '宠物明星',  emoji: '🌈', color: '#06B6D4', bg: '#ECFEFF', exp: 1500, reward: '积分 +400',    coins: 400, unlocks: ['彩虹特效', '明星称号'] },
  { level: 8,  title: '传奇宠物',  emoji: '💎', color: '#7C3AED', bg: '#F5F3FF', exp: 2000, reward: '积分 +600',    coins: 600, unlocks: ['钻石边框', '传奇称号'] },
  { level: 9,  title: '神话宠物',  emoji: '👑', color: '#D97706', bg: '#FFFBEB', exp: 3000, reward: '积分 +1000',   coins: 1000,unlocks: ['皇冠特效', '神话称号'] },
  { level: 10, title: '宠物之神',  emoji: '🌠', color: '#BE185D', bg: '#FDF2F8', exp: 5000, reward: '积分 +2000',   coins: 2000,unlocks: ['全部解锁！', '终极称号'] },
];

// Achievements definition
const ACHIEVEMENTS = [
  { id: 'first_gen',   emoji: '📸', name: '初次见面',   desc: '生成第一个卡通形象',   check: (d) => d.pet !== null },
  { id: 'first_feed',  emoji: '🍖', name: '爱的喂食',   desc: '第一次喂食宠物',        check: (d) => (d.pet?.hunger||0) < 100 },
  { id: 'first_game',  emoji: '🎮', name: '游戏初体验', desc: '第一次玩游戏',          check: (d) => d.totalScore > 0 },
  { id: 'streak3',     emoji: '🔥', name: '三日不间断', desc: '连续签到 3 天',          check: (d) => d.streak >= 3 },
  { id: 'streak7',     emoji: '💪', name: '坚持一周',   desc: '连续签到 7 天',          check: (d) => d.streak >= 7 },
  { id: 'level3',      emoji: '⭐', name: '成长中',     desc: '宠物升到 Lv.3',          check: (d) => (d.pet?.level||1) >= 3 },
  { id: 'level5',      emoji: '🌟', name: '实力派',     desc: '宠物升到 Lv.5',          check: (d) => (d.pet?.level||1) >= 5 },
  { id: 'coins100',    emoji: '🪙', name: '小富翁',     desc: '累计获得 100 积分',      check: (d) => d.totalCoinsEarned >= 100 },
  { id: 'coins500',    emoji: '💰', name: '积分大户',   desc: '累计获得 500 积分',      check: (d) => d.totalCoinsEarned >= 500 },
  { id: 'dodge100',    emoji: '🏃', name: '闪避高手',   desc: '跑酷得分超过 100',       check: (d) => (d.scores.runner||0) >= 100 },
  { id: 'fruit20',     emoji: '🍉', name: '水果忍者',   desc: '水果忍者得分超过 20',    check: (d) => (d.scores.fruit||0) >= 20 },
  { id: 'candy500',    emoji: '🍬', name: '消消高手',   desc: '消消乐得分超过 500',     check: (d) => (d.scores.candy||0) >= 500 },
];

let pet = null;
let claimedLevels = new Set();

window.addEventListener('load', async () => {
  claimedLevels = new Set(JSON.parse(localStorage.getItem('pw_claimed_levels') || '[]'));
  await loadData();
  renderAll();
});

async function loadData() {
  const session = localStorage.getItem('pw_session');
  if (!session) return;
  try {
    const s = JSON.parse(session);
    if (s.token) {
      const res = await fetch('/api/pet', { headers: { 'Authorization': 'Bearer ' + s.token } });
      const data = await res.json();
      if (data.pet) pet = data.pet;
    }
  } catch {}
}

function renderAll() {
  renderHero();
  renderStats();
  renderTimeline();
  renderAchievements();
}

function renderHero() {
  if (!pet) return;
  const level = pet.level || 1;
  const exp = pet.exp || 0;
  const lv = LEVELS[Math.min(level - 1, LEVELS.length - 1)];
  const nextLv = LEVELS[Math.min(level, LEVELS.length - 1)];
  const expNeeded = nextLv.exp;
  const pct = Math.min(100, Math.floor((exp / expNeeded) * 100));

  if (pet.cartoon_url) {
    const img = document.getElementById('hero-img');
    img.src = pet.cartoon_url;
    img.style.display = 'block';
    document.getElementById('hero-emoji').style.display = 'none';
  }
  document.getElementById('hero-name').textContent = pet.name;
  document.getElementById('hero-title').textContent = lv.emoji + ' ' + lv.title;
  document.getElementById('level-badge').textContent = 'Lv.' + level;
  document.getElementById('exp-info').textContent = `${exp} / ${expNeeded} 经验`;
  setTimeout(() => {
    document.getElementById('exp-bar').style.width = pct + '%';
  }, 300);
}

function renderStats() {
  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalScore = (scores.dodge||0) + (scores.memory||0) + (scores.tap||0) + (scores.runner||0) + (scores.fruit||0) + (scores.candy||0);
  const firstVisit = localStorage.getItem('pw_first_visit');
  if (!firstVisit) localStorage.setItem('pw_first_visit', Date.now().toString());
  const days = firstVisit ? Math.floor((Date.now() - parseInt(firstVisit)) / 86400000) + 1 : 1;

  document.getElementById('stat-days').textContent = days;
  document.getElementById('stat-games').textContent = totalScore;
  document.getElementById('stat-checkin').textContent = checkinData.streak || 0;
}

function renderTimeline() {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  const level = pet?.level || 1;
  const exp = pet?.exp || 0;

  LEVELS.forEach((lv, i) => {
    const isAchieved = level > lv.level;
    const isCurrent = level === lv.level;
    const isNext = level === lv.level - 1;
    const isClaimed = claimedLevels.has(lv.level);
    const canClaim = isAchieved && !isClaimed && lv.coins > 0;

    const item = document.createElement('div');
    item.className = 'timeline-item';

    const dotClass = isAchieved ? 'achieved' : isCurrent ? 'next' : 'locked';
    const dotStyle = `background:${isAchieved || isCurrent ? lv.bg : '#F3F4F6'}; border-color:${isAchieved || isCurrent ? lv.color : '#E5E7EB'};`;

    let progressHtml = '';
    if (isCurrent) {
      const pct = Math.min(100, Math.floor((exp / lv.exp) * 100));
      progressHtml = `<div class="tl-progress"><div class="tl-progress-bg"><div class="tl-progress-fill" style="width:${pct}%"></div></div><div style="font-size:10px;color:var(--gray-400);margin-top:3px;">${exp}/${lv.exp} 经验 (${pct}%)</div></div>`;
    }

    const unlocksHtml = lv.unlocks.map(u =>
      `<span class="unlock-tag ${isAchieved || isCurrent ? 'active' : ''}">${u}</span>`
    ).join('');

    const badgeHtml = isAchieved
      ? `<span class="achieved-badge">✓ 已达成</span>`
      : isCurrent ? `<span class="next-badge">当前等级</span>` : '';

    const claimHtml = canClaim
      ? `<button class="claim-btn" onclick="claimLevelReward(${lv.level}, ${lv.coins})">领取奖励 🪙${lv.coins}</button>`
      : '';

    item.innerHTML = `
      <div class="tl-dot ${dotClass}" style="${dotStyle}">${lv.emoji}</div>
      <div class="tl-content">
        <div class="tl-title">Lv.${lv.level} ${lv.title} ${badgeHtml}</div>
        <div class="tl-level">需要 ${lv.exp} 经验值</div>
        <div class="tl-reward">🎁 ${lv.reward}</div>
        <div class="tl-unlocks">${unlocksHtml}</div>
        ${progressHtml}
        ${claimHtml}
      </div>
    `;
    timeline.appendChild(item);
  });
}

function renderAchievements() {
  const grid = document.getElementById('ach-grid');
  grid.innerHTML = '';

  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalCoins = (scores.dodge||0) + (scores.memory||0) + (scores.tap||0) + (scores.runner||0);
  const gameData = { pet, streak: checkinData.streak||0, totalScore: Object.values(scores).reduce((a,b)=>a+b,0), totalCoinsEarned: totalCoins, scores };

  ACHIEVEMENTS.forEach(ach => {
    const isUnlocked = ach.check(gameData);
    const item = document.createElement('div');
    item.className = 'ach-item' + (isUnlocked ? ' unlocked' : '');
    item.innerHTML = `
      <div class="ach-emoji">${ach.emoji}</div>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-desc">${ach.desc}</div>
    `;
    grid.appendChild(item);
  });
}

function claimLevelReward(level, coins) {
  claimedLevels.add(level);
  localStorage.setItem('pw_claimed_levels', JSON.stringify([...claimedLevels]));
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  wardrobe.coins = (wardrobe.coins || 0) + coins;
  localStorage.setItem('pw_wardrobe', JSON.stringify(wardrobe));
  spawnConfetti();
  showToast(`🎉 领取成功！获得 🪙${coins} 积分！`);
  renderTimeline();
}

function spawnConfetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','💕','🧡','💛','🏆'];
  for (let i = 0; i < 16; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (10 + Math.random() * 80) + 'vw';
      el.style.top = (10 + Math.random() * 50) + 'vh';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }, i * 60);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

// Override renderTimeline and renderAchievements for new design
function renderTimeline() {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '<div class="absolute left-[15px] top-0 bottom-0 w-[2px] timeline-line"></div>';
  const level = pet?.level || 1;
  const exp = pet?.exp || 0;
  LEVELS.forEach((lv, i) => {
    const isAchieved = level > lv.level;
    const isCurrent = level === lv.level;
    const isClaimed = claimedLevels.has(lv.level);
    const canClaim = isAchieved && !isClaimed && lv.coins > 0;
    const dotColor = isAchieved ? 'bg-tertiary text-white' : isCurrent ? 'bg-primary text-white animate-bounce' : 'bg-surface-container-highest text-on-surface-variant';
    const cardBorder = isAchieved ? 'border-l-4 border-tertiary' : isCurrent ? 'border-l-4 border-primary' : 'border-l-4 border-outline-variant opacity-60';
    const cardBg = isAchieved ? 'bg-tertiary-fixed/30' : isCurrent ? 'bg-primary-container/20' : 'bg-surface-container';
    const pct = isCurrent ? Math.min(100, Math.floor((exp/lv.exp)*100)) : 0;
    const div = document.createElement('div');
    div.className = 'relative mb-lg';
    div.innerHTML = `
      <div class="absolute -left-[28px] top-0 w-6 h-6 rounded-full ${dotColor} flex items-center justify-center border-4 border-surface-bright text-[12px] z-10">${isAchieved ? '✓' : lv.level}</div>
      <div class="${cardBg} ${cardBorder} p-3 rounded-xl soft-pop">
        <div class="flex items-center gap-2 flex-wrap mb-1">
          <span class="font-display font-bold text-sm text-on-surface">Lv.${lv.level} ${lv.emoji} ${lv.title}</span>
          ${isAchieved ? '<span class="bg-tertiary-container text-on-tertiary-container px-2 py-0.5 rounded-full text-[10px] font-bold">已达成</span>' : ''}
          ${isCurrent ? '<span class="bg-primary text-white px-2 py-0.5 rounded-full text-[10px] font-bold">当前</span>' : ''}
        </div>
        <div class="text-xs text-on-surface-variant">🎁 ${lv.reward}</div>
        ${isCurrent ? `<div class="mt-2 h-1.5 w-full bg-white/50 rounded-full"><div class="h-full bg-primary rounded-full" style="width:${pct}%"></div></div><div class="text-[10px] mt-1 text-primary font-bold">${pct}% 完成</div>` : ''}
        ${canClaim ? `<button class="mt-2 bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full text-xs font-bold squishy" onclick="claimLevelReward(${lv.level}, ${lv.coins})">领取 🪙${lv.coins}</button>` : ''}
      </div>`;
    timeline.appendChild(div);
  });
}

function renderAchievements() {
  const grid = document.getElementById('ach-grid');
  grid.innerHTML = '';
  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalScore = Object.values(scores).reduce((a,b)=>a+(b||0),0);
  const gameData = { pet, streak: checkinData.streak||0, totalScore, totalCoinsEarned: totalScore, scores };
  ACHIEVEMENTS.forEach(ach => {
    const isUnlocked = ach.check(gameData);
    const div = document.createElement('div');
    div.className = `rounded-2xl p-sm flex flex-col items-center gap-1 text-center border ${isUnlocked ? 'bg-tertiary-fixed border-tertiary-container' : 'bg-surface-container border-outline-variant/30 opacity-50'}`;
    div.innerHTML = `<div class="text-2xl ${isUnlocked ? '' : 'grayscale opacity-50'}">${ach.emoji}</div><div class="font-display font-bold text-[11px] text-on-surface">${ach.name}</div><div class="text-[9px] text-on-surface-variant leading-tight">${ach.desc}</div>`;
    grid.appendChild(div);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}
</script>
</body></html>
