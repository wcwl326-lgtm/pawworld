<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 宠物想念你了！</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F97316; --orange-light: #FFF7ED;
    --purple: #8B5CF6; --purple-light: #EDE9FE;
    --gray-200: #E5E7EB; --gray-400: #9CA3AF;
    --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
    --radius-md: 18px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #0f0c29; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes twinkle { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  @keyframes heartbeat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
  @keyframes rain { 0% { transform:translateY(-10px); opacity:0; } 50% { opacity:1; } 100% { transform:translateY(60px); opacity:0; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; color: white; animation: twinkle 2s ease-in-out infinite; font-size: 12px; }

  .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 32px 24px; max-width: 380px; width: 90%; display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; z-index: 1; }

  .pet-wrap { position: relative; animation: float 3s ease-in-out infinite; }
  .pet-img { width: 140px; height: 140px; object-fit: cover; border-radius: 50%; border: 3px solid rgba(249,115,22,0.6); }
  .pet-emoji-fallback { font-size: 100px; }
  .tear-left, .tear-right { position: absolute; font-size: 20px; animation: rain 2s ease-in-out infinite; }
  .tear-left { left: 20px; top: 50px; animation-delay: 0s; }
  .tear-right { right: 20px; top: 50px; animation-delay: 0.5s; }

  .missing-title { font-family: 'Fredoka One', sans-serif; font-size: 26px; color: white; text-align: center; animation: fadeUp 0.5s ease 0.1s both; }
  .hours-badge { background: rgba(249,115,22,0.2); border: 1px solid rgba(249,115,22,0.4); border-radius: 20px; padding: 6px 16px; font-family: 'Fredoka One', sans-serif; font-size: 14px; color: #FED7AA; animation: fadeUp 0.5s ease 0.15s both; }

  .message-bubble { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px 18px 18px 4px; padding: 14px 16px; font-size: 14px; color: rgba(255,255,255,0.9); line-height: 1.7; text-align: left; width: 100%; animation: fadeUp 0.5s ease 0.2s both; min-height: 80px; }
  .message-loading { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 8px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: heartbeat 1s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .status-row { display: flex; gap: 10px; width: 100%; animation: fadeUp 0.5s ease 0.25s both; }
  .status-item { flex: 1; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .status-icon { font-size: 18px; }
  .status-val { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: white; margin-top: 2px; }
  .status-label { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 700; }
  .status-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .status-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .fill-o { background: #F97316; }
  .fill-p { background: #8B5CF6; }
  .fill-pk { background: #EC4899; }

  .action-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; animation: fadeUp 0.5s ease 0.3s both; }
  .main-btn { background: linear-gradient(135deg, #F97316, #EC4899); color: white; border: none; border-radius: 16px; padding: 16px; font-family: 'Fredoka One', sans-serif; font-size: 18px; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; display: block; box-shadow: 0 6px 20px rgba(249,115,22,0.4); }
  .main-btn:hover { transform: translateY(-2px); }
  .secondary-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); border-radius: 12px; padding: 12px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: all 0.2s; }
  .secondary-btn:hover { background: rgba(255,255,255,0.12); }

  .decoration { position: fixed; font-size: 40px; opacity: 0.06; pointer-events: none; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="decoration" style="top:10%;left:5%;transform:rotate(-20deg);">🐾</div>
<div class="decoration" style="top:20%;right:8%;transform:rotate(15deg);">❤️</div>
<div class="decoration" style="bottom:15%;left:8%;transform:rotate(10deg);">🌟</div>
<div class="decoration" style="bottom:25%;right:5%;transform:rotate(-15deg);">🐾</div>

<div class="card" id="main-card">
  <div class="pet-wrap">
    <img id="pet-img" src="" alt="宠物" class="pet-img" style="display:none;">
    <div id="pet-emoji" class="pet-emoji-fallback">🐾</div>
    <div class="tear-left">😢</div>
    <div class="tear-right">💧</div>
  </div>

  <div class="missing-title" id="missing-title">你的宠物想你了！</div>
  <div class="hours-badge" id="hours-badge">已经 ?? 小时没见到你了</div>

  <div class="message-bubble" id="message-bubble">
    <div class="message-loading">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="status-row" id="status-row" style="display:none;">
    <div class="status-item">
      <div class="status-icon">🍖</div>
      <div class="status-val" id="sv-hunger">-</div>
      <div class="status-label">饱食度</div>
      <div class="status-bar"><div class="status-fill fill-o" id="sb-hunger"></div></div>
    </div>
    <div class="status-item">
      <div class="status-icon">⚡</div>
      <div class="status-val" id="sv-energy">-</div>
      <div class="status-label">活力</div>
      <div class="status-bar"><div class="status-fill fill-p" id="sb-energy"></div></div>
    </div>
    <div class="status-item">
      <div class="status-icon">😊</div>
      <div class="status-val" id="sv-mood">-</div>
      <div class="status-label">心情</div>
      <div class="status-bar"><div class="status-fill fill-pk" id="sb-mood"></div></div>
    </div>
  </div>

  <div class="action-btns">
    <a href="/play.html" class="main-btn">❤️ 马上回去陪它！</a>
    <a href="/" class="secondary-btn">看看宠物形象</a>
  </div>
</div>

<script>
// Generate stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 40; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.textContent = Math.random() < 0.3 ? '✨' : '·';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  s.style.animationDelay = Math.random() * 3 + 's';
  s.style.fontSize = (8 + Math.random() * 10) + 'px';
  starsEl.appendChild(s);
}

async function init() {
  const session = localStorage.getItem('pw_session');
  if (!session) { window.location.href = '/'; return; }

  let pet = null, token = null;
  try {
    const s = JSON.parse(session);
    token = s.token;
    const res = await fetch('/api/pet', { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await res.json();
    pet = data.pet;
  } catch {}

  if (!pet) { window.location.href = '/play.html'; return; }

  // Calculate hours away
  const lastVisit = localStorage.getItem('pw_last_visit');
  const now = Date.now();
  const hoursAway = lastVisit ? Math.floor((now - parseInt(lastVisit)) / 3600000) : 25;

  // Decay stats based on time away
  const decayRate = Math.min(hoursAway * 2, 60);
  const hunger = Math.max(5, (pet.hunger || 80) - decayRate);
  const energy = Math.max(5, (pet.energy || 80) - Math.floor(decayRate * 0.5));
  const mood = Math.max(5, (pet.mood || 80) - decayRate);

  // Update pet stats in DB
  if (token && pet.id && hoursAway > 1) {
    fetch('/api/pet', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ id: pet.id, hunger, energy, mood })
    }).catch(() => {});
  }

  // Show pet image
  if (pet.cartoon_url) {
    const img = document.getElementById('pet-img');
    img.src = pet.cartoon_url;
    img.style.display = 'block';
    document.getElementById('pet-emoji').style.display = 'none';
  }

  // Update UI
  document.getElementById('missing-title').textContent = `${pet.name} 好想你！`;
  document.getElementById('hours-badge').textContent =
    hoursAway < 1 ? '刚刚还在想你~' :
    hoursAway === 1 ? '已经 1 小时没见到你了' :
    `已经 ${hoursAway} 小时没见到你了`;

  // Show status
  document.getElementById('status-row').style.display = 'flex';
  document.getElementById('sv-hunger').textContent = hunger;
  document.getElementById('sv-energy').textContent = energy;
  document.getElementById('sv-mood').textContent = mood;
  document.getElementById('sb-hunger').style.width = hunger + '%';
  document.getElementById('sb-energy').style.width = energy + '%';
  document.getElementById('sb-mood').style.width = mood + '%';

  // Get AI message
  try {
    const res = await fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ petName: pet.name, hoursAway, hunger, energy, mood })
    });
    const data = await res.json();
    document.getElementById('message-bubble').textContent = data.message || `${pet.name}：主人，你去哪儿了？我好想你啊... 😢`;
  } catch {
    document.getElementById('message-bubble').textContent = `${pet.name}：主人，你终于回来了！我等了好久好久... 我的肚子好饿，心情也不好，你能陪陪我吗？😢💕`;
  }
}

init();
</script>
</body>
</html>
