<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 我的主页</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F97316; --orange-light: #FFF7ED; --orange-mid: #FED7AA;
    --purple: #8B5CF6; --purple-light: #EDE9FE;
    --green: #10B981; --green-light: #ECFDF5;
    --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-400: #9CA3AF;
    --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
    --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', sans-serif; background: #FFF9F5; min-height: 100vh; }
  body::before { content: ''; position: fixed; top: -100px; right: -100px; width: 350px; height: 350px; background: radial-gradient(circle, #FED7AA 0%, transparent 70%); z-index: 0; pointer-events: none; }
  body::after { content: ''; position: fixed; bottom: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, #DDD6FE 0%, transparent 70%); z-index: 0; pointer-events: none; }
  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 16px 100px; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .logo { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); }
  .logo span { color: var(--purple); }

  /* Profile hero */
  .profile-hero { background: white; border-radius: var(--radius-lg); padding: 24px 20px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fadeUp 0.4s ease; position: relative; overflow: hidden; }
  .profile-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #FFF7ED 0%, #EDE9FE 100%); opacity: 0.5; }
  .avatar-wrap { position: relative; z-index: 1; }
  .avatar-circle { width: 100px; height: 150px; border-radius: 20px; background: var(--orange-light); border: 3px solid var(--orange); display: flex; align-items: center; justify-content: center; font-size: 44px; animation: float 3s ease-in-out infinite; overflow: hidden; }
  .avatar-pet-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .profile-email { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); position: relative; z-index: 1; }
  .profile-joined { font-size: 12px; color: var(--gray-400); font-weight: 700; position: relative; z-index: 1; }
  .profile-stats { display: flex; gap: 20px; position: relative; z-index: 1; }
  .profile-stat { text-align: center; }
  .profile-stat-val { font-family: 'Fredoka One', sans-serif; font-size: 20px; color: var(--orange); }
  .profile-stat-label { font-size: 10px; color: var(--gray-400); font-weight: 700; margin-top: 2px; }

  /* Pets section */
  .section-card { background: white; border-radius: var(--radius-lg); padding: 18px; border: 1.5px solid var(--gray-200); margin-bottom: 14px; animation: fadeUp 0.4s ease 0.05s both; }
  .section-title { font-family: 'Fredoka One', sans-serif; font-size: 16px; color: var(--gray-800); margin-bottom: 14px; }
  .pets-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .pet-slot { flex-shrink: 0; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pet-slot-img { width: 70px; height: 105px; border-radius: 14px; object-fit: cover; object-position: center top; border: 3px solid var(--orange); }
  .pet-slot-emoji { width: 70px; height: 105px; border-radius: 14px; background: var(--orange-light); border: 3px solid var(--orange); display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .pet-slot-name { font-family: 'Fredoka One', sans-serif; font-size: 13px; color: var(--gray-700); }
  .pet-slot-level { font-size: 10px; color: var(--purple); font-weight: 700; background: var(--purple-light); padding: 2px 8px; border-radius: 20px; }
  .pet-slot-locked { width: 70px; height: 105px; border-radius: 14px; background: var(--gray-100); border: 3px dashed var(--gray-200); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .pet-slot-lock-label { font-size: 10px; color: var(--gray-400); font-weight: 700; text-align: center; line-height: 1.4; }

  /* Add new pet button */
  .add-pet-btn { width: 100%; background: var(--orange); color: white; border: none; border-radius: var(--radius-md); padding: 14px; font-family: 'Fredoka One', sans-serif; font-size: 16px; cursor: pointer; transition: all 0.2s; margin-top: 4px; display: none; }
  .add-pet-btn:hover { background: #EA6C0A; transform: translateY(-2px); }
  .add-pet-btn.visible { display: block; }
  .locked-msg { font-size: 12px; color: var(--gray-400); text-align: center; margin-top: 8px; font-weight: 600; }

  /* Menu items */
  .menu-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--gray-200); overflow: hidden; margin-bottom: 14px; animation: fadeUp 0.4s ease 0.1s both; }
  .menu-item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--gray-100); text-decoration: none; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:hover { background: var(--gray-100); }
  .menu-icon { font-size: 24px; width: 32px; text-align: center; }
  .menu-text { flex: 1; }
  .menu-title { font-family: 'Fredoka One', sans-serif; font-size: 15px; color: var(--gray-800); }
  .menu-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .menu-arrow { font-size: 16px; color: var(--gray-400); }

  /* Logout button */
  .logout-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid #FCA5A5; overflow: hidden; margin-bottom: 14px; animation: fadeUp 0.4s ease 0.15s both; }
  .logout-btn { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; transition: background 0.2s; background: none; border: none; font-family: 'Nunito', sans-serif; }
  .logout-btn:hover { background: #FEF2F2; }
  .logout-title { font-family: 'Fredoka One', sans-serif; font-size: 15px; color: #DC2626; }

  .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: white; border-top: 1px solid var(--gray-200); display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; cursor: pointer; color: var(--gray-400); font-size: 10px; font-weight: 700; border: none; background: none; font-family: 'Nunito', sans-serif; text-decoration: none; transition: color 0.2s; }
  .nav-item.active { color: var(--orange); }
  .nav-icon { font-size: 22px; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div class="logo">Paw<span>World</span></div>
  </div>

  <!-- Profile hero -->
  <div class="profile-hero">
    <div class="avatar-wrap">
      <div class="avatar-circle" id="avatar-circle">
        <img id="avatar-pet-img" src="" alt="" class="avatar-pet-img" style="display:none;">
        <span id="avatar-emoji">🐾</span>
      </div>
    </div>
    <div class="profile-email" id="profile-email">加载中...</div>
    <div class="profile-joined" id="profile-joined">欢迎来到 PawWorld！</div>
    <div class="profile-stats">
      <div class="profile-stat">
        <div class="profile-stat-val" id="stat-pets">0</div>
        <div class="profile-stat-label">只宠物</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-val" id="stat-days">0</div>
        <div class="profile-stat-label">陪伴天数</div>
      </div>
      <div class="profile-stat">
        <div class="profile-stat-val" id="stat-streak">0</div>
        <div class="profile-stat-label">连续签到</div>
      </div>
    </div>
  </div>

  <!-- My pets -->
  <div class="section-card">
    <div class="section-title">🐾 我的宠物</div>
    <div class="pets-row" id="pets-row"></div>
    <button class="add-pet-btn" id="add-pet-btn" onclick="goAddPet()">✨ 添加新宠物</button>
    <div class="locked-msg" id="locked-msg"></div>
  </div>

  <!-- Menu -->
  <div class="menu-card">
    <a href="/milestone.html" class="menu-item">
      <div class="menu-icon">🏆</div>
      <div class="menu-text">
        <div class="menu-title">成长里程碑</div>
        <div class="menu-sub">查看宠物成就和等级</div>
      </div>
      <div class="menu-arrow">→</div>
    </a>
    <a href="/wardrobe.html" class="menu-item">
      <div class="menu-icon">👗</div>
      <div class="menu-text">
        <div class="menu-title">换装衣橱</div>
        <div class="menu-sub">用积分解锁配件</div>
      </div>
      <div class="menu-arrow">→</div>
    </a>
    <a href="/checkin.html" class="menu-item">
      <div class="menu-icon">📅</div>
      <div class="menu-text">
        <div class="menu-title">每日签到</div>
        <div class="menu-sub" id="checkin-sub">领取每日奖励</div>
      </div>
      <div class="menu-arrow">→</div>
    </a>
    <div class="menu-item" onclick="showCoins()">
      <div class="menu-icon">🪙</div>
      <div class="menu-text">
        <div class="menu-title">我的积分</div>
        <div class="menu-sub" id="coins-sub">0 积分</div>
      </div>
      <div class="menu-arrow">→</div>
    </div>
  </div>

  <!-- Logout -->
  <div class="logout-card">
    <button class="logout-btn" onclick="doLogout()">
      <div class="menu-icon">🚪</div>
      <div class="menu-text">
        <div class="logout-title">退出登录</div>
      </div>
    </button>
  </div>

  <div style="text-align:center;font-size:11px;color:var(--gray-400);margin-top:8px;">
    PawWorld · 让每只宠物都有专属卡通形象 🐾
  </div>
</div>

<div class="nav-bar">
  <a href="/play.html" class="nav-item "><div class="nav-icon">🎮</div>互动</a>
  <a href="/wardrobe.html" class="nav-item "><div class="nav-icon">👗</div>衣橱</a>
  <a href="/checkin.html" class="nav-item "><div class="nav-icon">📅</div>签到</a>
  <a href="/milestone.html" class="nav-item "><div class="nav-icon">🏆</div>成长</a>
  <a href="/profile.html" class="nav-item active"><div class="nav-icon">👤</div>我的</a>
</div>

<script>
const UNLOCK_LEVELS = [1, 5, 8];
const MAX_PETS = 3;
let allPets = [];

window.addEventListener('load', async () => {
  const session = localStorage.getItem('pw_session');
  if (!session) { window.location.href = '/'; return; }

  try {
    const s = JSON.parse(session);
    if (!s.token) { window.location.href = '/'; return; }

    // Show email
    document.getElementById('profile-email').textContent = s.user?.email || '';

    // Joined date
    const firstVisit = localStorage.getItem('pw_first_visit');
    if (!firstVisit) localStorage.setItem('pw_first_visit', Date.now().toString());
    const days = firstVisit ? Math.floor((Date.now() - parseInt(firstVisit)) / 86400000) + 1 : 1;
    document.getElementById('profile-joined').textContent = `已加入 ${days} 天`;

    // Load pets
    const res = await fetch('/api/pets-all', { headers: { 'Authorization': 'Bearer ' + s.token } });
    if (res.ok) {
      const data = await res.json();
      allPets = data.pets || [];
    }

    renderProfile();
  } catch { window.location.href = '/'; }
});

function renderProfile() {
  // Stats
  document.getElementById('stat-pets').textContent = allPets.length;
  const firstVisit = localStorage.getItem('pw_first_visit');
  const days = firstVisit ? Math.floor((Date.now() - parseInt(firstVisit)) / 86400000) + 1 : 1;
  document.getElementById('stat-days').textContent = days;
  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  document.getElementById('stat-streak').textContent = checkinData.streak || 0;

  // Avatar - use first pet's image
  if (allPets[0]?.cartoon_url) {
    const img = document.getElementById('avatar-pet-img');
    img.src = allPets[0].cartoon_url;
    img.style.display = 'block';
    document.getElementById('avatar-emoji').style.display = 'none';
  }

  // Coins
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  document.getElementById('coins-sub').textContent = (wardrobe.coins || 0) + ' 积分';

  // Checkin
  const checkin = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('checkin-sub').textContent = checkin.lastCheckin === today ? '✅ 今日已签到' : '📅 今日未签到，快去领奖励！';

  // Pets row
  renderPetsRow();
}

function renderPetsRow() {
  const row = document.getElementById('pets-row');
  row.innerHTML = '';

  // Show existing pets
  allPets.forEach(pet => {
    const slot = document.createElement('div');
    slot.className = 'pet-slot';
    slot.innerHTML = `
      ${pet.cartoon_url
        ? `<img src="${pet.cartoon_url}" class="pet-slot-img" alt="${pet.name}">`
        : `<div class="pet-slot-emoji">🐾</div>`}
      <div class="pet-slot-name">${pet.name}</div>
      <div class="pet-slot-level">Lv.${pet.level || 1}</div>
    `;
    slot.onclick = () => window.location.href = '/play.html';
    row.appendChild(slot);
  });

  // Show locked slots
  for (let i = allPets.length; i < MAX_PETS; i++) {
    const neededLevel = UNLOCK_LEVELS[i];
    const slot = document.createElement('div');
    slot.className = 'pet-slot';
    slot.innerHTML = `
      <div class="pet-slot-locked">🔒</div>
      <div class="pet-slot-lock-label">Lv.${neededLevel} 解锁</div>
    `;
    row.appendChild(slot);
  }

  // Add pet button logic
  const highestLevel = allPets.length > 0
    ? Math.max(...allPets.map(p => p.level || 1))
    : 0;
  const addBtn = document.getElementById('add-pet-btn');
  const lockedMsg = document.getElementById('locked-msg');

  if (allPets.length === 0) {
    addBtn.classList.add('visible');
    addBtn.textContent = '✨ 创建第一只宠物';
    lockedMsg.textContent = '';
  } else if (allPets.length >= MAX_PETS) {
    addBtn.classList.remove('visible');
    lockedMsg.textContent = '已达到最多 3 只宠物的上限 🎉';
  } else {
    const neededLevel = UNLOCK_LEVELS[allPets.length];
    if (highestLevel >= neededLevel) {
      addBtn.classList.add('visible');
      addBtn.textContent = `✨ 添加第 ${allPets.length + 1} 只宠物`;
      lockedMsg.textContent = '';
    } else {
      addBtn.classList.remove('visible');
      lockedMsg.textContent = `🔒 任意宠物达到 Lv.${neededLevel} 即可解锁第 ${allPets.length + 1} 只宠物（当前最高 Lv.${highestLevel}）`;
    }
  }
}

function goAddPet() {
  window.location.href = '/';
}

function showCoins() {
  const wardrobe = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  alert(`🪙 你目前有 ${wardrobe.coins || 0} 积分\n\n去玩游戏赚更多积分，在衣橱里解锁配件！`);
}

function doLogout() {
  if (!confirm('确定要退出登录吗？')) return;
  localStorage.removeItem('pw_session');
  window.location.href = '/';
}
</script>
</body>
</html>
