<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PawWorld — 换装衣橱</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F97316; --orange-light: #FFF7ED; --orange-mid: #FED7AA;
    --purple: #8B5CF6; --purple-light: #EDE9FE;
    --green: #10B981; --green-light: #ECFDF5;
    --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-400: #9CA3AF;
    --gray-600: #4B5563; --gray-700: #374151; --gray-800: #1F2937;
    --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', sans-serif; background: #FFF9F5; min-height: 100vh; }
  body::before { content: ''; position: fixed; top: -100px; right: -100px; width: 350px; height: 350px; background: radial-gradient(circle, #FED7AA 0%, transparent 70%); z-index: 0; pointer-events: none; }
  body::after { content: ''; position: fixed; bottom: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, #DDD6FE 0%, transparent 70%); z-index: 0; pointer-events: none; }
  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 16px 16px 100px; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes pop { 0% { transform:scale(0.8); opacity:0; } 70% { transform:scale(1.1); } 100% { transform:scale(1); opacity:1; } }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); }
  .logo span { color: var(--purple); }

  /* Coins bar */
  .coins-bar { background: white; border-radius: var(--radius-md); padding: 12px 16px; border: 1.5px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; animation: fadeUp 0.4s ease; }
  .coins-left { display: flex; align-items: center; gap: 8px; }
  .coins-icon { font-size: 24px; }
  .coins-val { font-family: 'Fredoka One', sans-serif; font-size: 20px; color: var(--orange); }
  .coins-label { font-size: 12px; color: var(--gray-400); font-weight: 700; }
  .earn-btn { background: var(--purple-light); color: var(--purple); border: none; border-radius: 10px; padding: 6px 14px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
  .earn-btn:hover { background: var(--purple); color: white; }

  /* Pet preview */
  .preview-card { background: white; border-radius: var(--radius-lg); padding: 20px; border: 1.5px solid var(--gray-200); display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 14px; animation: fadeUp 0.4s ease 0.05s both; position: relative; overflow: hidden; }
  .preview-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #FFF7ED 0%, #EDE9FE 100%); opacity: 0.4; }
  .pet-preview-wrap { position: relative; width: 140px; height: 210px; animation: float 3s ease-in-out infinite; overflow: visible; }
  .pet-preview-img { width: 140px; height: 210px; object-fit: cover; object-position: center top; border-radius: 17px; border: 3px solid var(--orange); position: relative; z-index: 2; background: transparent; }
  .pet-preview-emoji { font-size: 80px; display: flex; align-items: center; justify-content: center; width: 140px; height: 210px; position: relative; z-index: 2; }

  /* Accessory overlay layers */
  .acc-layer { position: absolute; z-index: 3; pointer-events: none; }
  .acc-hat { top: 2%; left: 50%; transform: translateX(-50%); }
  .acc-glasses { top: 26%; left: 50%; transform: translateX(-50%); }
  .acc-neck { top: 36%; left: 50%; transform: translateX(-50%); }
  .acc-bg { position: absolute; inset: 0; z-index: 1; border-radius: 20px; overflow: hidden; }

  .pet-preview-name { font-family: 'Fredoka One', sans-serif; font-size: 18px; color: var(--gray-800); position: relative; z-index: 1; }
  .pet-preview-level { background: var(--purple-light); color: var(--purple); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; position: relative; z-index: 1; }
  .equipped-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
  .equipped-tag { background: var(--orange-light); color: var(--orange); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .equipped-tag:hover { background: #FECACA; color: #DC2626; }

  /* Category tabs */
  .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; }
  .cat-tab { background: white; border: 1.5px solid var(--gray-200); border-radius: 20px; padding: 7px 16px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--gray-600); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
  .cat-tab.active { background: var(--orange); border-color: var(--orange); color: white; }

  /* Items grid */
  .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .item-card { background: white; border: 2px solid var(--gray-200); border-radius: var(--radius-md); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
  .item-card:hover { transform: translateY(-2px); border-color: var(--orange-mid); box-shadow: 0 4px 12px rgba(249,115,22,0.15); }
  .item-card.equipped { border-color: var(--orange); background: var(--orange-light); }
  .item-card.locked { opacity: 0.7; cursor: default; }
  .item-card.locked:hover { transform: none; border-color: var(--gray-200); box-shadow: none; }
  .item-art { width: 72px; height: 72px; border-radius: 12px; overflow: hidden; }
  .item-name { font-family: 'Fredoka One', sans-serif; font-size: 12px; color: var(--gray-700); text-align: center; }
  .item-cost { font-size: 11px; font-weight: 700; }
  .item-cost.free { color: var(--green); }
  .item-cost.coins { color: var(--orange); }
  .item-cost.owned { color: var(--orange); }
  .lock-overlay { position: absolute; top: 6px; right: 6px; font-size: 14px; }
  .check-badge { position: absolute; top: 6px; right: 6px; background: var(--orange); color: white; font-size: 10px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; }

  /* Unlock modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.visible { display: flex; }
  .modal-sheet { background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 560px; animation: pop 0.3s ease; }
  .modal-art { width: 80px; height: 80px; border-radius: 14px; margin: 0 auto 10px; overflow: hidden; }
  .modal-title { font-family: 'Fredoka One', sans-serif; font-size: 20px; color: var(--gray-800); text-align: center; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--gray-400); text-align: center; margin-bottom: 16px; }
  .modal-cost { font-family: 'Fredoka One', sans-serif; font-size: 22px; color: var(--orange); text-align: center; margin-bottom: 16px; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-btn { padding: 14px; border-radius: var(--radius-sm); font-family: 'Fredoka One', sans-serif; font-size: 16px; cursor: pointer; border: none; transition: all 0.2s; text-align: center; }
  .modal-btn.primary { background: var(--orange); color: white; }
  .modal-btn.secondary { background: var(--gray-100); color: var(--gray-700); }
  .not-enough { background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #DC2626; text-align: center; margin-bottom: 12px; display: none; }
  .not-enough.visible { display: block; }

  /* Toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 500; display: none; font-family: 'Nunito', sans-serif; }
  .toast.visible { display: block; animation: pop 0.3s ease; }

  .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: white; border-top: 1px solid var(--gray-200); display: flex; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; cursor: pointer; color: var(--gray-400); font-size: 10px; font-weight: 700; border: none; background: none; font-family: 'Nunito', sans-serif; text-decoration: none; transition: color 0.2s; }
  .nav-item.active { color: var(--orange); }
  .nav-icon { font-size: 22px; }
</style>
</head>

  </div>

<div class="modal-overlay" id="unlock-modal">

    <div class="not-enough" id="not-enough">积分不足！去玩游戏赚更多积分吧 🎮</div>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal()">取消</button>
      <button class="modal-btn primary" id="unlock-btn" onclick="confirmUnlock()">解锁</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="nav-bar">
  <a href="/play.html" class="nav-item"><div class="nav-icon">🎮</div>互动</a>

  { id:'nk_amethyst', cat:'neck', name:'紫水晶胸针', cost:130, desc:'神秘紫晶', svgBg:'radial-gradient(circle at 40% 40%,#f3e5f5,#e8d5f5)',
    svg:`<svg width="64" height="64" viewBox="0 0 64 64"><defs><radialGradient id="ab1" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#CE93D8"/><stop offset="100%" stop-color="#6A1B9A"/></radialGradient></defs><path d="M16,32 Q32,22 48,32" fill="none" stroke="#BA68C8" stroke-width="1.5"/><path d="M16,32 L19,46 Q24,52 32,54 Q40,52 45,46 L48,32" fill="none" stroke="#9C27B0" stroke-width="1.5"/><circle cx="16" cy="32" r="4" fill="url(#ab1)" stroke="#7B1FA2" stroke-width="1"/><circle cx="48" cy="32" r="4" fill="url(#ab1)" stroke="#7B1FA2" stroke-width="1"/><circle cx="32" cy="54" r="5.5" fill="url(#ab1)" stroke="#6A1B9A" stroke-width="1.5"/><circle cx="30" cy="52" r="2" fill="white" opacity="0.4"/><circle cx="26" cy="49" r="3.5" fill="#BA68C8" stroke="#7B1FA2" stroke-width="1"/><circle cx="38" cy="49" r="3.5" fill="#BA68C8" stroke="#7B1FA2" stroke-width="1"/></svg>`,
    overlaySize: 64 },

  // BACKGROUNDS
  { id:'bg_heart', cat:'bg', name:'爱心背景', cost:0, desc:'满满爱意', svgBg:'linear-gradient(135deg,#ff9a9e,#fecfef)', svg:'', bgStyle:'linear-gradient(135deg,#ffb3ba,#ffd6e0)', bgEmoji:'💕' },
  { id:'bg_snow', cat:'bg', name:'雪地背景', cost:60, desc:'冬日童话', svgBg:'linear-gradient(180deg,#a8edff,#e0f7fa)', svg:'', bgStyle:'linear-gradient(180deg,#c8f0ff,#e8f8ff)', bgEmoji:'❄️' },
  { id:'bg_rainbow', cat:'bg', name:'彩虹背景', cost:80, desc:'七彩绚丽', svgBg:'linear-gradient(135deg,#a8ff78,#78ffd6)', svg:'', bgStyle:'linear-gradient(135deg,#ffcccc,#ffffcc,#ccffcc,#ccccff)', bgEmoji:'🌈' },
  { id:'bg_night', cat:'bg', name:'星空背景', cost:100, desc:'璀璨星夜', svgBg:'radial-gradient(circle,#0a0a1a,#1a1a3e)', svg:'', bgStyle:'radial-gradient(circle at center,#1a1a3e,#0a0a1a)', bgEmoji:'⭐' },
  { id:'bg_space', cat:'bg', name:'宇宙背景', cost:120, desc:'浩瀚宇宙', svgBg:'radial-gradient(circle,#000010,#001030)', svg:'', bgStyle:'radial-gradient(circle at center,#001030,#000010)', bgEmoji:'🚀' },
  { id:'bg_fire', cat:'bg', name:'地狱背景', cost:150, desc:'燃烧地狱', svgBg:'radial-gradient(circle,#1a0000,#3d0000)', svg:'', bgStyle:'radial-gradient(circle at bottom,#ff4500,#1a0000)', bgEmoji:'🔥' },
];

let pet = null;
let coins = 0;
let unlocked = new Set();
let equipped = { hat: null, glasses: null, neck: null, bg: null };
let currentCat = 'all';
let pendingItem = null;

window.addEventListener('load', () => { loadData(); });

async function loadData() {
  const saved = localStorage.getItem('pw_wardrobe');
  if (saved) {
    try {
      const d = JSON.parse(saved);
      coins = d.coins || 0;
      unlocked = new Set(d.unlocked || ['hat_magic','gl_sunglasses','nk_pearl','bg_heart']);
      equipped = d.equipped || { hat: null, glasses: null, neck: null, bg: null };
    } catch { unlocked = new Set(['hat_magic','gl_sunglasses','nk_pearl','bg_heart']); }
  } else {
    unlocked = new Set(['hat_magic','gl_sunglasses','nk_pearl','bg_heart']);
  }
  const scores = JSON.parse(localStorage.getItem('pw_scores') || '{}');
  const totalGameCoins = Object.values(scores).reduce((a,b)=>a+(b||0),0);
  const savedData = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  coins = Math.max(coins, totalGameCoins - (savedData.spentCoins||0));

  const checkinData = JSON.parse(localStorage.getItem('pw_checkin') || '{}');
  const checkinCoins = (checkinData.history?.length || 0) * 20;
  coins = Math.max(coins, checkinCoins - (savedData.spentCoins||0));

  const session = localStorage.getItem('pw_session');
  if (session) {
    try {
      const s = JSON.parse(session);
      if (s.token) {
        const res = await fetch('/api/pet', { headers: { 'Authorization': 'Bearer ' + s.token } });
        const data = await res.json();
        if (data.pet) pet = data.pet;
      }
    } catch {}
  }
  renderAll();
}

function saveData() {
  const saved = JSON.parse(localStorage.getItem('pw_wardrobe') || '{}');
  localStorage.setItem('pw_wardrobe', JSON.stringify({ coins, unlocked:[...unlocked], equipped, spentCoins: saved.spentCoins||0 }));
}

function renderAll() {
  document.getElementById('coins-display').textContent = coins;
  if (pet) {
    document.getElementById('pet-preview-name').textContent = pet.name;
    document.getElementById('pet-preview-level').textContent = 'Lv.' + pet.level;
    if (pet.cartoon_url) {
      const img = document.getElementById('pet-preview-img');
      img.src = pet.cartoon_url;
      img.style.display = 'block';
      document.getElementById('pet-preview-emoji').style.display = 'none';
    }
  }
  renderEquipped();
  renderItems();
}

function renderEquipped() {
  // Hat - ~88px wide, centered
  const hatEl = document.getElementById('acc-hat');
  if (equipped.hat) {
    const item = ITEMS.find(i=>i.id===equipped.hat);
    if (item && item.svg) {
      const s = 88;
      const svg = item.svg.replace(/width="64"/g,'width="'+s+'"').replace(/height="64"/g,'height="'+s+'"');
      hatEl.innerHTML = '<div style="width:'+s+'px;height:'+s+'px;overflow:visible;">'+svg+'</div>';
      hatEl.style.display = 'block';
    }
  } else hatEl.style.display = 'none';

  // Glasses - 110px wide
  const glEl = document.getElementById('acc-glasses');
  if (equipped.glasses) {
    const item = ITEMS.find(i=>i.id===equipped.glasses);
    if (item && item.svg) {
      const s = 68; const h = Math.round(s*0.48);
      const svg = item.svg.replace(/width="64"/g,'width="'+s+'"').replace(/height="64"/g,'height="'+h+'"');
      glEl.innerHTML = '<div style="width:'+s+'px;height:'+h+'px;overflow:visible;">'+svg+'</div>';
      glEl.style.display = 'block';
    }
  } else glEl.style.display = 'none';

  // Neck - 100px wide
  const nkEl = document.getElementById('acc-neck');
  if (equipped.neck) {
    const item = ITEMS.find(i=>i.id===equipped.neck);
    if (item && item.svg) {
      const s = 80; const h = Math.round(s*0.6);
      const svg = item.svg.replace(/width="64"/g,'width="'+s+'"').replace(/height="64"/g,'height="'+h+'"');
      nkEl.innerHTML = '<div style="width:'+s+'px;height:'+h+'px;overflow:visible;">'+svg+'</div>';
      nkEl.style.display = 'block';
    }
  } else nkEl.style.display = 'none';

  // Background - apply directly to pet image as box-shadow/outline trick
  const petWrap = document.getElementById('pet-preview-wrap');
  const petImg = document.getElementById('pet-preview-img');
  const bgEl = document.getElementById('acc-bg');
  if (equipped.bg) {
    const item = ITEMS.find(i=>i.id===equipped.bg);
    if (item && item.bgStyle) {
      petWrap.style.borderRadius = '20px';
      petWrap.style.overflow = 'hidden';
      bgEl.style.cssText = 'position:absolute;top:0;left:0;width:140px;height:210px;z-index:0;border-radius:17px;display:block;background:'+item.bgStyle+';';
      bgEl.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:0.2;">'+( item.bgEmoji||'')+'</div>';
      if (petImg) petImg.style.position = 'relative';
    }
  } else {
    petWrap.style.borderRadius = '';
    petWrap.style.overflow = 'visible';
    bgEl.style.cssText = 'display:none;';
    bgEl.innerHTML = '';
    if (petImg) petImg.style.position = 'relative';
  }


  // Tags
  const tags = document.getElementById('equipped-tags');
  tags.innerHTML = '';
  Object.entries(equipped).forEach(([cat,id])=>{
    if (!id) return;
    const item = ITEMS.find(i=>i.id===id);
    if (!item) return;
    const tag = document.createElement('div');
    tag.className = 'equipped-tag';
    tag.innerHTML = `${item.name} ✕`;
    tag.onclick = () => { equipped[cat]=null; saveData(); renderAll(); };
    tags.appendChild(tag);
  });
  if (!Object.values(equipped).some(Boolean)) {
    tags.innerHTML = '<div style="font-size:12px;color:var(--gray-400);">点击配件来装扮你的宠物！</div>';
  }
}

function renderItems() {
  const grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  const filtered = currentCat==='all' ? ITEMS : ITEMS.filter(i=>i.cat===currentCat);
  filtered.forEach(item => {
    const isUnlocked = unlocked.has(item.id);
    const isEquipped = Object.values(equipped).includes(item.id);
    const card = document.createElement('div');
    card.className = 'item-card' + (isEquipped?' equipped':'') + (!isUnlocked?' locked':'');

    let costHtml = '';
    if (isEquipped) costHtml = `<div class="item-cost owned">✓ 已装备</div>`;
    else if (isUnlocked) costHtml = `<div class="item-cost free">✓ 已解锁</div>`;
    else if (item.cost===0) costHtml = `<div class="item-cost free">免费</div>`;
    else costHtml = `<div class="item-cost coins">🪙 ${item.cost}</div>`;

    // Build art - bg items show gradient, others show SVG
    let artHtml = '';
    if (item.cat==='bg') {
      artHtml = `<div class="item-art" style="background:${item.svgBg};display:flex;align-items:center;justify-content:center;font-size:28px;">${item.bgEmoji||'✨'}</div>`;
    } else {
      artHtml = `<div class="item-art" style="background:${item.svgBg};">${item.svg}</div>`;
    }

    card.innerHTML = `
      ${isEquipped ? '<div class="check-badge">✓</div>' : ''}
      ${!isUnlocked ? '<div class="lock-overlay">🔒</div>' : ''}
      ${artHtml}
      <div class="item-name">${item.name}</div>
      ${costHtml}
    `;
    card.onclick = () => onItemClick(item);
    grid.appendChild(card);
  });
}

function onItemClick(item) {
  const isUnlocked = unlocked.has(item.id);
  const isEquipped = Object.values(equipped).includes(item.id);
  if (isEquipped) { equipped[item.cat]=null; saveData(); renderAll(); return; }
  if (isUnlocked) { equipItem(item); return; }
  pendingItem = item;
  // Show modal
  if (item.cat==='bg') {
    document.getElementById('modal-art').innerHTML = `<div style="width:80px;height:80px;border-radius:14px;background:${item.svgBg};display:flex;align-items:center;justify-content:center;font-size:36px;">${item.bgEmoji||'✨'}</div>`;
  } else {
    document.getElementById('modal-art').innerHTML = `<div style="width:80px;height:80px;border-radius:14px;background:${item.svgBg};">${item.svg}</div>`;
  }
  document.getElementById('modal-name').textContent = item.name;
  document.getElementById('modal-desc').textContent = item.desc;
  document.getElementById('not-enough').classList.remove('visible');
  if (item.cost===0) {
    document.getElementById('modal-cost').textContent = '免费解锁！';
    document.getElementById('unlock-btn').disabled = false;
    document.getElementById('unlock-btn').textContent = '免费获取';
  } else {
    document.getElementById('modal-cost').textContent = `🪙 ${item.cost} 积分`;
    const has = coins >= item.cost;
    document.getElementById('unlock-btn').disabled = !has;
    document.getElementById('unlock-btn').textContent = has ? '解锁' : '积分不足';
    if (!has) document.getElementById('not-enough').classList.add('visible');
  }
  document.getElementById('unlock-modal').classList.add('visible');
}

function confirmUnlock() {
  if (!pendingItem) return;
  const item = pendingItem;
  if (item.cost>0) { if (coins<item.cost) return; coins-=item.cost; const s=JSON.parse(localStorage.getItem('pw_wardrobe')||'{}'); s.spentCoins=(s.spentCoins||0)+item.cost; localStorage.setItem('pw_wardrobe',JSON.stringify(s)); }
  unlocked.add(item.id);
  saveData();
  closeModal();
  equipItem(item);
  showToast(`🎉 ${item.name} 已解锁并装备！`);
}

function equipItem(item) {
  equipped[item.cat] = item.id;
  saveData();
  renderAll();
  showToast(`✨ ${item.name} 已装备！`);
}

function closeModal() { document.getElementById('unlock-modal').classList.remove('visible'); pendingItem=null; }
function switchCat(cat,el) { currentCat=cat; document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderItems(); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('visible'); setTimeout(()=>t.classList.remove('visible'),2000); }
</script>
</body>
</html>
